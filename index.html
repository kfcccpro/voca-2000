<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WORD MASTER 2000 · 수능 영단어</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0E1016;--bg2:#151823;--panel:#1B1F2E;--panel2:#222840;
--line:#2A3050;--line2:#3A4270;
--txt:#EEF1FA;--txt2:#9AA3C4;--txt3:#5B6485;
--iris:#6C5CE7;--iris2:#8B7BFF;--cyan:#00E5D4;--lime:#A6FF3D;
--pink:#FF5DA2;--amber:#FFB443;--red:#FF4D6D;--green:#2BE38A;
--grad-hero:linear-gradient(120deg,#6C5CE7 0%,#00E5D4 100%);
--grad-lime:linear-gradient(120deg,#A6FF3D 0%,#00E5D4 100%);
--grad-pink:linear-gradient(120deg,#FF5DA2 0%,#FFB443 100%);
--r-sm:10px;--r:16px;--r-lg:24px;--r-xl:32px;
--disp:'Space Grotesk','Pretendard',sans-serif;
--sans:'Pretendard',-apple-system,sans-serif;
--sb-w:248px;
--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);
line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:
 radial-gradient(680px 420px at 78% -8%,rgba(108,92,231,.28),transparent 60%),
 radial-gradient(560px 400px at -6% 108%,rgba(0,229,212,.20),transparent 60%),
 radial-gradient(500px 360px at 110% 90%,rgba(255,93,162,.14),transparent 60%);}
.mono,.num{font-family:var(--disp);font-feature-settings:"tnum"}
button{font-family:inherit}
::selection{background:var(--iris);color:#fff}
/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== SHELL: sidebar + main (PC) ===== */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));
border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--grad-hero);display:grid;place-items:center;
font-family:var(--disp);font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 24px rgba(108,92,231,.5)}
.brand .bt{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.3px;line-height:1.1}
.brand .bs{font-size:11px;color:var(--txt3);letter-spacing:2px;font-weight:600}
.navlink{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;color:var(--txt2);
font-weight:600;font-size:14.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;
transition:.2s var(--ease);position:relative}
.navlink svg{width:21px;height:21px;flex-shrink:0}
.navlink:hover{background:var(--panel);color:var(--txt)}
.navlink.on{background:var(--panel2);color:#fff}
.navlink.on::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);
width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--grad-hero)}
.navlink .badge-n{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;
padding:1px 8px;border-radius:20px;min-width:20px;text-align:center;font-family:var(--disp)}
.sb-spacer{flex:1}
.lvl-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}
.lvl-card .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.lvl-badge{width:34px;height:34px;border-radius:11px;background:var(--grad-lime);display:grid;place-items:center;
font-family:var(--disp);font-weight:700;color:#0E1016;font-size:15px}
.lvl-card .lv-title{font-size:12.5px;color:var(--txt2);font-weight:600}
.lvl-card .lv-n{font-family:var(--disp);font-weight:700;font-size:15px}
.xpbar{height:7px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:4px}
.xpbar>i{display:block;height:100%;background:var(--grad-lime);border-radius:20px;transition:width .7s var(--ease)}
.xp-txt{font-size:11px;color:var(--txt3);margin-top:6px;font-family:var(--disp);font-weight:600}

.main{padding:0 40px 80px;max-width:1180px;width:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
padding:20px 0 18px;background:linear-gradient(180deg,var(--bg) 62%,transparent);margin-bottom:8px}
.page-h{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.6px}
.page-sub{color:var(--txt2);font-size:13.5px;margin-top:2px}
.tb-right{display:flex;align-items:center;gap:12px}
.pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
padding:8px 15px;border-radius:20px;font-weight:700;font-size:13.5px}
.pill.fire{color:var(--amber)}.pill.gem{color:var(--cyan)}
.pill .num{font-family:var(--disp)}

.view{display:none;animation:vin .45s var(--ease)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* cards / grid */
.grid{display:grid;gap:18px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;position:relative;overflow:hidden}
.card.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
background:var(--grad-hero);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.stat-lbl{font-size:12.5px;color:var(--txt2);font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.stat-big{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;margin:10px 0 4px;letter-spacing:-1px}
.grad-txt{background:var(--grad-hero);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-lime{background:var(--grad-lime);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-pink{background:var(--grad-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.mini{font-size:12.5px;color:var(--txt3)}

.progline{height:10px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:14px;position:relative}
.progline>i{display:block;height:100%;background:var(--grad-hero);border-radius:20px;transition:width .8s var(--ease);
box-shadow:0 0 18px rgba(108,92,231,.6);position:relative}
.progline>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
animation:shine 2.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(200%)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border:none;
border-radius:15px;font-weight:700;font-size:15px;cursor:pointer;transition:.2s var(--ease);position:relative;overflow:hidden}
.btn-hero{background:var(--grad-hero);color:#fff;box-shadow:0 10px 30px rgba(108,92,231,.45)}
.btn-hero:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(108,92,231,.6)}
.btn-hero:active{transform:translateY(0) scale(.98)}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
.btn-ghost:hover{background:var(--line);transform:translateY(-2px)}
.btn-lime{background:var(--grad-lime);color:#0E1016}
.btn-lime:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(166,255,61,.4)}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;box-shadow:none!important}
.btn.wfull{width:100%}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:12px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;font-family:var(--disp)}
.chip.iris{background:rgba(108,92,231,.18);color:var(--iris2)}
.chip.cyan{background:rgba(0,229,212,.15);color:var(--cyan)}
.chip.lime{background:rgba(166,255,61,.16);color:var(--lime)}
.chip.pink{background:rgba(255,93,162,.16);color:var(--pink)}
.chip.gray{background:var(--bg);color:var(--txt3)}
.chip.green{background:rgba(43,227,138,.15);color:var(--green)}

/* DAY GRID */
.daygrid{display:grid;grid-template-columns:repeat(10,1fr);gap:12px}
.daycell{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
transition:.22s var(--ease);overflow:hidden}
.daycell:hover{transform:translateY(-4px) scale(1.04);border-color:var(--line2);background:var(--panel2);z-index:2}
.daycell .dn{font-family:var(--disp);font-weight:700;font-size:19px}
.daycell .dp{font-size:9.5px;color:var(--txt3);font-family:var(--disp);font-weight:600}
.daycell .ring{position:absolute;bottom:0;left:0;height:3px;background:var(--grad-hero);transition:width .6s var(--ease)}
.daycell.done{border-color:var(--green);background:rgba(43,227,138,.1)}
.daycell.done .dn{color:var(--green)}
.daycell.done::before{content:"✓";position:absolute;top:6px;right:8px;color:var(--green);font-weight:800;font-size:12px}
.daycell.partial .dn{color:var(--iris2)}

/* FLASHCARD */
.study-stage{max-width:640px;margin:0 auto}
.flash-wrap{perspective:1600px;margin:22px 0}
.flash{position:relative;width:100%;min-height:360px;transform-style:preserve-3d;transition:transform .6s var(--ease);cursor:pointer}
.flash.flip{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;
background:var(--panel);border:1px solid var(--line)}
.flash-front{background:linear-gradient(160deg,var(--panel2),var(--panel))}
.flash-back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(108,92,231,.25),var(--panel))}
.flash .w{font-family:var(--disp);font-weight:700;font-size:52px;letter-spacing:-1px}
.flash .m{font-size:30px;font-weight:700;line-height:1.45}
.flash .tag{position:absolute;top:20px;left:22px}
.flash .fav{position:absolute;top:18px;right:22px;font-size:26px;cursor:pointer;z-index:3;transition:.2s}
.flash .fav:hover{transform:scale(1.2)}
.flash .hint{position:absolute;bottom:22px;font-size:12.5px;color:var(--txt3)}

.study-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}

/* QUIZ */
.q-stage{max-width:680px;margin:0 auto}
.q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.q-prog{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--txt2)}
.combo{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--amber);opacity:0;transform:scale(.6);transition:.25s var(--ease)}
.combo.show{opacity:1;transform:scale(1)}
.q-word{font-family:var(--disp);font-weight:700;font-size:46px;text-align:center;margin:6px 0 4px;letter-spacing:-1px}
.q-sub{text-align:center;color:var(--txt3);font-size:13px;margin-bottom:22px;font-weight:600}
.opts{display:grid;gap:12px}
.opt{padding:19px 22px;border:1px solid var(--line);background:var(--panel);border-radius:16px;font-size:17px;
font-weight:600;text-align:left;cursor:pointer;transition:.18s var(--ease);color:var(--txt);position:relative}
.opt:hover:not(:disabled){border-color:var(--iris);background:var(--panel2);transform:translateX(4px)}
.opt.correct{border-color:var(--green);background:rgba(43,227,138,.14);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.14);color:var(--red)}
.opt:disabled{cursor:default}
.opt .kbd{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:12px;
color:var(--txt3);border:1px solid var(--line);border-radius:7px;padding:2px 8px}

/* MATCH */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mbtn{padding:18px 12px;border:1px solid var(--line);background:var(--panel);border-radius:15px;font-size:16px;
font-weight:600;cursor:pointer;transition:.18s var(--ease);color:var(--txt);min-height:62px}
.mbtn:hover:not(.matched){border-color:var(--line2);transform:scale(1.02)}
.mbtn.sel{border-color:var(--iris);background:rgba(108,92,231,.18);color:var(--iris2)}
.mbtn.matched{opacity:0;pointer-events:none;transition:opacity .35s}
.mbtn.err{border-color:var(--red);background:rgba(255,77,109,.16);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* RESULT */
.result{max-width:520px;margin:20px auto;text-align:center}
.result .em{font-size:76px;margin-bottom:6px;animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.result .score{font-family:var(--disp);font-weight:700;font-size:30px}
.result .pct{font-family:var(--disp);font-weight:700;font-size:60px;letter-spacing:-2px;margin:4px 0}

/* LISTS (review) */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin-bottom:20px}
.seg button{padding:10px 20px;border:none;background:none;border-radius:10px;font-weight:700;font-size:14px;
color:var(--txt2);cursor:pointer;transition:.18s var(--ease);font-family:var(--sans)}
.seg button.on{background:var(--panel2);color:#fff}
.wlist{display:grid;gap:10px}
.wrow{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--panel);
border:1px solid var(--line);border-radius:15px;transition:.18s var(--ease)}
.wrow:hover{border-color:var(--line2);transform:translateX(3px)}
.wrow .w{font-family:var(--disp);font-weight:700;font-size:18px}
.wrow .m{font-size:13.5px;color:var(--txt2);margin-top:1px}
.wrow .rt{display:flex;align-items:center;gap:10px}
.icon-btn{background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:11px;cursor:pointer;
color:var(--txt2);font-size:16px;transition:.18s;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--line2);color:var(--txt)}

/* ADMIN */
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.akpi{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.akpi .lbl{font-size:12px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.akpi .v{font-family:var(--disp);font-weight:700;font-size:34px;margin-top:8px;letter-spacing:-1px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 24px;font-size:13.5px}
th{color:var(--txt3);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{border-bottom:1px solid var(--bg2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
td .num,th .num{font-family:var(--disp)}
.bar-cell{display:flex;align-items:center;gap:10px}
.bar-cell .track{flex:1;height:7px;background:var(--bg);border-radius:20px;overflow:hidden;min-width:80px}
.bar-cell .track>i{display:block;height:100%;background:var(--grad-hero);border-radius:20px}
.admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.mail-note{background:rgba(0,229,212,.08);border:1px solid rgba(0,229,212,.25);border-radius:16px;
padding:16px 20px;font-size:13px;color:var(--txt2);margin-bottom:20px;line-height:1.7}
.mail-note b{color:var(--cyan)}

/* toast + confetti + fx */
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
border:1px solid var(--line2);color:#fff;padding:14px 24px;border-radius:16px;font-weight:700;font-size:14.5px;
z-index:200;opacity:0;transition:.3s var(--ease);box-shadow:0 16px 40px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti{position:absolute;width:10px;height:14px;border-radius:2px;will-change:transform,opacity}
.xp-float{position:fixed;font-family:var(--disp);font-weight:700;font-size:22px;color:var(--lime);z-index:180;pointer-events:none;
text-shadow:0 2px 12px rgba(166,255,61,.6)}
.lvlup{position:fixed;inset:0;z-index:190;display:grid;place-items:center;pointer-events:none;opacity:0}
.lvlup.show{opacity:1;transition:.4s}
.lvlup .box{background:var(--panel2);border:1px solid var(--line2);border-radius:28px;padding:40px 56px;text-align:center;
box-shadow:0 0 80px rgba(108,92,231,.6);transform:scale(.6);transition:.5s var(--ease)}
.lvlup.show .box{transform:scale(1)}
.lvlup .big{font-family:var(--disp);font-weight:700;font-size:40px;background:var(--grad-lime);
-webkit-background-clip:text;background-clip:text;color:transparent}

.empty{text-align:center;padding:70px 20px;color:var(--txt3)}
.empty .i{font-size:52px;margin-bottom:14px}
.select-box{width:100%;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
color:var(--txt);font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
.select-box:focus{outline:none;border-color:var(--iris)}

/* mobile fallback */
@media(max-width:900px){
 :root{--sb-w:0px}
 .shell{grid-template-columns:1fr}
 .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:100%;flex-direction:row;
  border-right:none;border-top:1px solid var(--line);padding:8px;gap:2px;z-index:60;
  justify-content:space-around;background:var(--bg2)}
 .brand,.sb-spacer,.lvl-card{display:none}
 .navlink{flex-direction:column;gap:3px;font-size:10px;padding:8px 4px;text-align:center;border-radius:12px}
 .navlink svg{width:22px;height:22px}
 .navlink.on::before{display:none}
 .navlink .badge-n{position:absolute;top:2px;right:14px;margin:0}
 .main{padding:0 16px 90px;max-width:100%}
 .g-3,.g-2{grid-template-columns:1fr}
 .daygrid{grid-template-columns:repeat(5,1fr)}
 .admin-grid{grid-template-columns:repeat(2,1fr)}
 .page-h{font-size:22px}
 .flash .w{font-size:40px}.q-word{font-size:34px}
 .tbl-wrap{overflow-x:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">W</div>
      <div><div class="bt">WORD MASTER</div><div class="bs">수능 2000</div></div>
    </div>
    <button class="navlink on" data-nav="Home" onclick="go('Home')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>대시보드</button>
    <button class="navlink" data-nav="Study" onclick="go('Study')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>학습 (DAY)</button>
    <button class="navlink" data-nav="Quiz" onclick="go('Quiz')">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 115.2.8c0 1.7-2.2 2.2-2.2 3.9M12 17h.01"/></svg>퀴즈</button>

<script>/* ===== EmailJS 설정 ===== */
// 아래 3개값을 emailjs.com 계정에서 얻은 값으로 교체하세요:
const EMAILJS_SERVICE_ID = 'service_v23hns6';        // 2단계에서 받은 Service ID
const EMAILJS_TEMPLATE_ID = 'template_v2zb8ni';      // 3단계에서 받은 Template ID
const EMAILJS_PUBLIC_KEY = 'JJdWMghPhZrilD_ZQ';      // 4단계에서 받은 Public Key

let emailJSReady = false;

function initEmailJS(){
 if(window.emailjs){emailjs.init(EMAILJS_PUBLIC_KEY);emailJSReady=true;console.log('EmailJS Ready');}
}

async function sendReportEmail(opts={}){
 if(!emailJSReady){toast('이메일 설정 대기 중...');return false;}
 const pct=Math.round(seenCount()/TOTAL*100);const totQ=S.quizStat.done;
 const accur=totQ?Math.round(S.quizStat.correct/totQ*100):0;const L=levelInfo();
 const doneDays=[];for(let d=1;d<=DAYS;d++)if(dayProgress(d).seen===dayProgress(d).total)doneDays.push(d);
 
 const historyLines=S.history.slice(0,10).map(h=>{
  const dt=new Date(h.date);
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} · ${h.type} ${h.day?'D'+h.day:''} · ${h.correct}/${h.total} · +${h.xp}XP`;
 }).join('\n')||'(없음)';

 const templateParams={
  to_email:ADMIN_EMAIL,
  user_name:opts.userName||'학습자',
  report_date:new Date().toLocaleString('ko-KR'),
  progress:pct,
  mastered:masteredCount(),
  total_xp:S.xp,
  streak:S.streak,
  accuracy:accur,
  completed_days:doneDays.length,
  total_days:DAYS,
  completed_day_list:doneDays.join(', ')||'없음',
  wrong_count:wrongList().length,
  history_count:Math.min(10,S.history.length),
  recent_history:historyLines,
  level:L.lv,
  level_name:L.name
 };

 try{
  const res=await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,templateParams);
  toast('✓ 리포트를 관리자에게 발송했어요');
  console.log('Email sent:',res);return true;
 }catch(err){
  console.error('EmailJS error:',err);
  toast('⚠ 메일 발송 실패. 설정을 확인하세요');return false;
 }
}

/* ===== WORDS:[id,day,no,word,mean] ===== */
const DAYS=50,PER=40,TOTAL=WORDS.length;
const ADMIN_EMAIL='sk01197375068@gmail.com';
const byId={};WORDS.forEach(w=>byId[w[0]]=w);
const wordsOf=d=>WORDS.filter(w=>w[1]===d);

/* ===== state ===== */
const KEY='wm2000_pc_v1';
const defState=()=>({
 seen:{},mastered:{},wrong:{},fav:{},dayDone:{},
 streak:0,lastDate:'',xp:0,
 quizStat:{done:0,correct:0},
 history:[],      // {date, type, day, correct, total, xp}  학습 이력
 daily:{},        // 'YYYY-MM-DD': {studied:0, quizzed:0, correct:0, xp:0}
 dayLog:{}        // day: {firstDone:date, lastStudied:date, quizzes:n, bestPct:0}
});
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||defState();}catch(e){S=defState();}
 const d=defState();for(const k in d)if(!(k in S))S[k]=d[k];}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
load();

/* ===== level system ===== */
const LEVELS=[[0,'새싹'],[100,'입문'],[300,'수련생'],[600,'실력자'],[1000,'준마스터'],[1600,'마스터'],[2400,'그랜드마스터'],[3500,'전설']];
function levelInfo(){let lv=1,name='새싹',cur=0,next=100;
 for(let i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){lv=i+1;name=LEVELS[i][1];cur=LEVELS[i][0];next=LEVELS[i+1]?LEVELS[i+1][0]:LEVELS[i][0]+1200;}}
 const span=next-cur,into=S.xp-cur;return{lv,name,cur,next,pct:Math.min(100,Math.round(into/span*100)),into,span};}
function addXP(n,x,y){
 const before=levelInfo().lv;S.xp+=n;
 const t=today();S.daily[t]=S.daily[t]||{studied:0,quizzed:0,correct:0,xp:0};S.daily[t].xp+=n;
 save();floatXP(n,x,y);renderLevel();
 const after=levelInfo().lv;if(after>before)levelUp(after);
}

/* ===== date/streak ===== */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchStreak(){const t=today();if(S.lastDate===t)return;
 const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
 S.streak=(S.lastDate===ys)?S.streak+1:1;S.lastDate=t;save();}
function markDaily(k){const t=today();S.daily[t]=S.daily[t]||{studied:0,quizzed:0,correct:0,xp:0};S.daily[t][k]=(S.daily[t][k]||0)+1;save();}

/* ===== utils ===== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
const seenCount=()=>Object.keys(S.seen).length;
const masteredCount=()=>Object.values(S.mastered).filter(v=>v>=2).length;
const wrongList=()=>Object.keys(S.wrong).filter(id=>S.wrong[id]>0).map(id=>byId[+id]).filter(Boolean);
const favList=()=>Object.keys(S.fav).filter(id=>S.fav[id]).map(id=>byId[+id]).filter(Boolean);
function dayProgress(d){const ws=wordsOf(d);return{seen:ws.filter(w=>S.seen[w[0]]).length,total:ws.length};}
function firstUnfinishedDay(){for(let d=1;d<=DAYS;d++){if(dayProgress(d).seen<dayProgress(d).total)return d;}return DAYS;}

/* ===== FX: confetti / xp float / level up ===== */
function confetti(x,y,n=90){const L=$('#fxLayer');const cols=['#6C5CE7','#00E5D4','#A6FF3D','#FF5DA2','#FFB443','#2BE38A'];
 for(let i=0;i<n;i++){const c=el('div','confetti');const col=cols[i%cols.length];
  c.style.background=col;c.style.left=x+'px';c.style.top=y+'px';
  const ang=Math.random()*Math.PI*2,vel=6+Math.random()*10,vx=Math.cos(ang)*vel,vy=Math.sin(ang)*vel-8;
  L.appendChild(c);let px=x,py=y,t=0;
  const tick=()=>{t++;px+=vx;py+=vy+t*0.55;c.style.transform=`translate(${px-x}px,${py-y}px) rotate(${t*18}deg)`;
   c.style.opacity=Math.max(0,1-t/60);if(t<60)requestAnimationFrame(tick);else c.remove();};requestAnimationFrame(tick);}}

function renderMC(){const {qs,i,rev,correct,combo}=SESS;const w=qs[i];

function startMatch(pool){touchStreak();const N=Math.min(6,pool.length);

 SESS.timer=setInterval(()=>{SESS.left--;const t=$('#mTimer');if(t)t.textContent=SESS.left+'s';if(SESS.left<=0){clearInterval(SESS.timer);finishMatch();}},1000);}
function renderMatch(){const ws=shuffle(SESS.pairs.map(w=>({id:w[0],t:w[3]})));const ms=shuffle(SESS.pairs.map(w=>({id:w[0],t:w[4]})));
 stage('vQuiz',`<div class="q-stage">
   <div class="q-head">
     <button class="btn btn-ghost sm" onclick="quitMatch()">← 나가기</button>
     <div class="q-prog">⏱ <span class="num timer" id="mTimer">${SESS.left}s</span> · <span class="num">${SESS.matched}/${SESS.pairs.length}</span></div>
   </div>

   <div class="match-cols">
     <div class="opts" id="mL">${ws.map(x=>`<button class="mbtn" data-id="${x.id}" data-side="L">${x.t}</button>`).join('')}</div>
     <div class="opts" id="mR">${ms.map(x=>`<button class="mbtn" data-id="${x.id}" data-side="R">${x.t}</button>`).join('')}</div>
   </div>
 </div>`);
 document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>matchClick(b));}
function matchClick(btn){if(btn.classList.contains('matched'))return;const sel=SESS.sel;
 if(!sel){SESS.sel=btn;btn.classList.add('sel');return;}
 if(sel===btn){btn.classList.remove('sel');SESS.sel=null;return;}
 if(sel.dataset.side===btn.dataset.side){sel.classList.remove('sel');btn.classList.add('sel');SESS.sel=btn;return;}
 if(sel.dataset.id===btn.dataset.id){sel.classList.remove('sel');sel.classList.add('matched');btn.classList.add('matched');
  SESS.matched++;SESS.sel=null;const w=byId[+btn.dataset.id];if(!S.seen[w[0]])S.seen[w[0]]=true;S.mastered[w[0]]=(S.mastered[w[0]]||0)+1;
  SESS.gained+=8;const r=btn.getBoundingClientRect();addXP(8,r.left+r.width/2,r.top);save();
  const p=$('#mTimer').closest('.q-prog');p.innerHTML=p.innerHTML.replace(/<span class="num">\d+\/\d+<\/span>/,`<span class="num">${SESS.matched}/${SESS.pairs.length}</span>`);
  if(SESS.matched===SESS.pairs.length){clearInterval(SESS.timer);setTimeout(finishMatch,350);}
 }else{sel.classList.add('err');btn.classList.add('err');const w1=byId[+sel.dataset.id];S.wrong[w1[0]]=(S.wrong[w1[0]]||0)+1;save();
  const a=sel,b=btn;a.classList.remove('sel');SESS.sel=null;setTimeout(()=>{a.classList.remove('err');b.classList.remove('err');},420);}}
function quitMatch(){clearInterval(SESS.timer);go('Quiz');}
function finishMatch(){clearInterval(SESS.timer);const done=SESS.matched,total=SESS.pairs.length;markDaily('quizzed');
 S.history.unshift({date:new Date().toISOString(),type:'매칭',day:quizScope.day,correct:done,total,xp:SESS.gained});save();
 if(done===total)confetti(innerWidth/2,innerHeight*0.35,120);
 stage('vQuiz',`<div class="result">
   <div class="em">${done===total?'🎯':'⏰'}</div>
   <div class="score"><span class="num">${done}</span> / <span class="num">${total}</span> 매칭</div>
   <div style="margin:14px 0 22px"><span class="chip lime">+${SESS.gained} XP</span></div>
   <button class="btn btn-hero wfull" style="margin-bottom:12px" onclick="go('Quiz')">다시 하기</button>
   <button class="btn btn-ghost wfull" onclick="go('Home')">대시보드로</button>
 </div>`);}

/* ===== REVIEW ===== */
function renderReview(){const v=$('#vReview');
 v.innerHTML=`<div class="seg" id="rSeg">
   <button class="on" data-r="wrong">오답 (${wrongList().length})</button>
   <button data-r="fav">즐겨찾기 (${favList().length})</button>
 </div><div id="rBox"></div>`;
 const seg=$('#rSeg'),box=$('#rBox');
 const draw=mode=>{const list=mode==='wrong'?wrongList():favList();box.innerHTML='';
  if(!list.length){box.appendChild(el('div','empty',`<div class="i">${mode==='wrong'?'✅':'☆'}</div>${mode==='wrong'?'오답이 없어요. 완벽해요!':'즐겨찾기한 단어가 없어요'}`));return;}
  if(mode==='wrong'&&list.length>=4){const b=el('button','btn btn-hero','오답 '+list.length+'단어 집중 퀴즈 →');b.style.marginBottom='16px';
   b.onclick=()=>{quizScope={mode:'wrong',day:null};startQuizMode('mc',list);};box.appendChild(b);}
  const wl=el('div','wlist');
  list.forEach(w=>{const r=el('div','wrow',`<div><div class="w">${w[3]}</div><div class="m">${w[4]}</div></div>
    <div class="rt"><span class="chip gray">D${w[1]}</span>
    ${mode==='wrong'?`<button class="icon-btn" data-clr="${w[0]}" title="해결">✓</button>`:`<button class="icon-btn" data-unfav="${w[0]}">⭐</button>`}</div>`);
   wl.appendChild(r);});
  box.appendChild(wl);
  box.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{S.wrong[+b.dataset.clr]=0;save();toast('오답 정복!');draw('wrong');seg.querySelector('[data-r=wrong]').textContent=`오답 (${wrongList().length})`;renderLevel();});
  box.querySelectorAll('[data-unfav]').forEach(b=>b.onclick=()=>{S.fav[+b.dataset.unfav]=false;save();draw('fav');seg.querySelector('[data-r=fav]').textContent=`즐겨찾기 (${favList().length})`;});};
 seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.r);});
 draw('wrong');
}

/* ===== ADMIN ===== */
function renderAdmin(){const v=$('#vAdmin');
 const pct=Math.round(seenCount()/TOTAL*100);
 const totQ=S.quizStat.done,accur=totQ?Math.round(S.quizStat.correct/totQ*100):0;
 const activeDays=Object.keys(S.daily).length;
 v.innerHTML=`
  <div class="mail-note">📮 <b>관리자 리포트</b>는 <b>${ADMIN_EMAIL}</b> 로 전송됩니다. 아래 <b>보고서 이메일 작성</b>을 누르면 요약이 담긴 메일 초안이 열려요. 상세 데이터가 필요하면 <b>CSV 내려받기</b>로 첨부하세요. (웹앱은 서버가 없어 자동 발송 대신 초안 생성 방식으로 동작해요)</div>
  <div class="admin-grid">
    <div class="akpi"><div class="lbl">전체 진도</div><div class="v grad-txt">${pct}%</div></div>
    <div class="akpi"><div class="lbl">완전 암기</div><div class="v grad-lime">${masteredCount()}</div></div>
    <div class="akpi"><div class="lbl">퀴즈 정답률</div><div class="v">${accur}%</div></div>
    <div class="akpi"><div class="lbl">학습한 날</div><div class="v grad-pink">${activeDays}</div></div>
  </div>

  <div class="tbl-wrap" style="margin-bottom:24px">
    <div class="tbl-head"><div style="font-family:var(--disp);font-weight:700;font-size:16px">DAY별 학습 내역</div>
      <span class="chip iris">${Object.keys(S.dayDone).filter(d=>S.dayDone[d]).length} / ${DAYS} 완료</span></div>
    <div style="max-height:340px;overflow-y:auto">
    <table><thead><tr><th>DAY</th><th>진도</th><th>학습률</th><th>퀴즈</th><th>최고점</th><th>상태</th></tr></thead>
    <tbody>${Array.from({length:DAYS},(_,k)=>{const d=k+1;const dp=dayProgress(d);const lg=S.dayLog[d]||{};const p=Math.round(dp.seen/dp.total*100);
      const st=dp.seen===dp.total?'<span class="chip green">완료</span>':dp.seen>0?'<span class="chip iris">진행중</span>':'<span class="chip gray">-</span>';
      return `<tr><td class="num" style="font-weight:700">DAY ${d}</td>
        <td class="num">${dp.seen}/${dp.total}</td>
        <td><div class="bar-cell"><div class="track"><i style="width:${p}%"></i></div><span class="num" style="color:var(--txt2);font-size:12px">${p}%</span></div></td>
        <td class="num">${lg.quizzes||0}회</td>
        <td class="num">${lg.bestPct?lg.bestPct+'%':'-'}</td>
        <td>${st}</td></tr>`;}).join('')}</tbody></table>
    </div>
  </div>

  <div class="tbl-wrap" style="margin-bottom:24px">
    <div class="tbl-head"><div style="font-family:var(--disp);font-weight:700;font-size:16px">최근 학습 이력</div>
      <span class="chip gray">최근 ${Math.min(20,S.history.length)}건</span></div>
    ${S.history.length?`<div style="max-height:300px;overflow-y:auto"><table><thead><tr><th>일시</th><th>유형</th><th>DAY</th><th>결과</th><th>XP</th></tr></thead>
     <tbody>${S.history.slice(0,20).map(h=>{const dt=new Date(h.date);const ds=`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const ty=h.type==='학습'?'<span class="chip iris">학습</span>':h.type==='매칭'?'<span class="chip pink">매칭</span>':'<span class="chip cyan">퀴즈</span>';
      return `<tr><td class="num" style="color:var(--txt2)">${ds}</td><td>${ty}</td><td class="num">${h.day?'D'+h.day:'-'}</td>
        <td class="num">${h.correct}/${h.total}</td><td class="num grad-lime" style="font-weight:700">+${h.xp}</td></tr>`;}).join('')}</tbody></table></div>`
     :'<div class="empty"><div class="i">📭</div>아직 학습 이력이 없어요</div>'}
  </div>

  <div class="card">
    <div style="font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px">보고서 내보내기 · 전송</div>
    <div class="mini" style="margin-bottom:16px">관리자(${ADMIN_EMAIL})에게 전달할 리포트를 만들어요</div>
    <div class="admin-actions">
      <button class="btn btn-hero" onclick="mailReport()">📧 보고서 이메일 작성</button>
      <button class="btn btn-ghost" onclick="downloadCSV()">⬇ DAY별 CSV</button>
      <button class="btn btn-ghost" onclick="downloadHistoryCSV()">⬇ 학습이력 CSV</button>
      <button class="btn btn-ghost" onclick="downloadReport()">📄 요약 리포트(.txt)</button>
      <button class="btn btn-ghost" onclick="backupJSON()">💾 백업(JSON)</button>
      <label class="btn btn-ghost" style="cursor:pointer">📂 복원<input type="file" accept=".json" style="display:none" onchange="restoreJSON(event)"></label>
    </div>
  </div>`;
}

/* ---- report builders ---- */
function reportSummary(){const pct=Math.round(seenCount()/TOTAL*100);const totQ=S.quizStat.done;
 const accur=totQ?Math.round(S.quizStat.correct/totQ*100):0;const L=levelInfo();
 const doneDays=[];for(let d=1;d<=DAYS;d++)if(dayProgress(d).seen===dayProgress(d).total)doneDays.push(d);
 return `[워드마스터 수능2000 학습 리포트]
생성일: ${new Date().toLocaleString('ko-KR')}
─────────────────────────
■ 전체 진도: ${pct}% (${seenCount()}/${TOTAL} 단어)
■ 완전 암기: ${masteredCount()} 단어
■ 완료 DAY: ${doneDays.length}/${DAYS} ${doneDays.length?'(DAY '+doneDays.join(', ')+')':''}
■ 퀴즈 정답률: ${accur}% (${S.quizStat.correct}/${totQ})
■ 현재 오답: ${wrongList().length} 단어
■ 연속 학습: ${S.streak}일
■ 레벨: Lv.${L.lv} ${L.name} (${S.xp} XP)
■ 학습한 날: ${Object.keys(S.daily).length}일
─────────────────────────
■ 최근 학습 이력 (최대 10건)
${S.history.slice(0,10).map(h=>{const dt=new Date(h.date);return `  ${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} · ${h.type} ${h.day?'D'+h.day:''} · ${h.correct}/${h.total} · +${h.xp}XP`;}).join('\n')||'  (없음)'}`;
}
function mailReport(){const body=encodeURIComponent(reportSummary()+'\n\n※ 상세 데이터는 CSV 첨부를 참고하세요.');
 const subj=encodeURIComponent(`[학습리포트] 워드마스터 수능2000 · ${today()} · 진도 ${Math.round(seenCount()/TOTAL*100)}%`);
 window.location.href=`mailto:${ADMIN_EMAIL}?subject=${subj}&body=${body}`;toast('메일 초안을 열었어요');}
function dl(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
 const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast('내려받기 시작');}
function downloadCSV(){let rows=[['DAY','학습단어','전체','학습률(%)','퀴즈횟수','최고점(%)','상태','마지막학습']];
 for(let d=1;d<=DAYS;d++){const dp=dayProgress(d);const lg=S.dayLog[d]||{};
  rows.push([d,dp.seen,dp.total,Math.round(dp.seen/dp.total*100),lg.quizzes||0,lg.bestPct||'',dp.seen===dp.total?'완료':dp.seen?'진행중':'미시작',lg.lastStudied||'']);}
 const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');dl(`워드마스터_DAY별내역_${today()}.csv`,csv,'text/csv;charset=utf-8');}
function downloadHistoryCSV(){let rows=[['일시','유형','DAY','정답','총문항','획득XP']];
 S.history.forEach(h=>{const dt=new Date(h.date);rows.push([dt.toLocaleString('ko-KR'),h.type,h.day||'',h.correct,h.total,h.xp]);});
 const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');dl(`워드마스터_학습이력_${today()}.csv`,csv,'text/csv;charset=utf-8');}
function downloadReport(){dl(`워드마스터_리포트_${today()}.txt`,reportSummary(),'text/plain;charset=utf-8');}
function backupJSON(){dl(`워드마스터_백업_${today()}.json`,JSON.stringify(S),'application/json');}
function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.seen)throw 0;S=o;const d=defState();for(const k in d)if(!(k in S))S[k]=d[k];save();toast('복원 완료!');go('Admin');renderLevel();}catch(err){toast('올바른 백업 파일이 아니에요');}};r.readAsText(f);}

/* ===== global keyboard: space=flip on flashcard ===== */
document.addEventListener('keydown',e=>{
 if(cur!=='Study'||!$('#flash'))return;
 if(e.code==='Space'){e.preventDefault();flip();}
 else if(e.key==='ArrowRight'){e.preventDefault();fNext(null);}
 else if(e.key==='ArrowLeft'){e.preventDefault();fPrev();}
});

/* ===== init ===== */
renderLevel();renderHome();

function sendDayReport(day){
 toast('DAY '+day+' 학습 결과를 관리자에게 발송 중...');
 const dp=dayProgress(day);
 const lg=S.dayLog[day]||{};
 sendReportEmail({
  userName:'DAY '+day,
  extraInfo:`학습률: ${Math.round(dp.seen/dp.total*100)}% · 퀴즈: ${lg.quizzes||0}회 · 최고점: ${lg.bestPct||'-'}%`
 });
}


window.addEventListener('load',()=>initEmailJS());
renderLevel();renderHome();
</script>
