 return `<div class="recovery-alert"><h3>⚠ 기존 진도 복구 필요</h3><div class="mini">현재 브라우저와 클라우드 모두 실질적인 학습기록이 확인되지 않습니다. 약 2일 진행 사실을 기준으로 DAY 1~2 완료 상태를 복구한 뒤 클라우드에 저장·검증할 수 있습니다. 실제 문항수·정답률·오답·시간은 원본 백업이 없으면 임의 생성하지 않습니다.</div><div class="recovery-actions"><button type="button" class="btn btn-hero sm" onclick="wmRecoverThroughDay2()">DAY 2까지 즉시 복구</button><button type="button" class="btn btn-ghost sm" onclick="wmManualSync()">클라우드 다시 확인</button></div></div>`;
}
async function wmRecoverThroughDay2(){
 if(ROLE!=='admin'){toast('관리자 권한이 필요합니다');return;}
 if(!confirm('DAY 1과 DAY 2를 관리자 복구 완료로 기록하고 현재 진도를 DAY 3으로 이동합니다.\n\n실제 문제 수·정답률·오답·학습시간은 조작하지 않습니다. 계속하시겠습니까?'))return;
 const now=new Date().toISOString();
 for(let d=1;d<=2;d++){
  const r=S.dayRecords[d]||{};
  S.dayDone[d]=true;
  S.dayRecords[d]={...r,status:'completed',startedAt:r.startedAt||now,completedAt:now,lastActivityAt:now,completionMethod:'admin_recovery_day2',forced:true,forcedAt:now,forcedBy:'admin',forceScope:'DAY 1~2'};
  S.dayLog[d]=S.dayLog[d]||{firstDone:today(),quizzes:0,bestPct:0};
  S.dayLog[d].completedAt=now;S.dayLog[d].lastStudied=today();S.dayLog[d].adminForced=true;
 }
 S.adminActions=S.adminActions||[];
 S.adminActions.unshift({type:'recover_through_day2',throughDay:2,days:[1,2],at:now,actor:'admin'});
 S.progress=S.progress||{};S.progress.lastCompletedDay=Math.max(+S.progress.lastCompletedDay||0,2);S.progress.lastCompletedAt=now;S.progress.currentDay=3;S.progress.lastActivityAt=now;
 save();
 const ok=await wmVerifiedCloudSave('admin_recovery_day2');
 toast(ok?'✓ DAY 2 복구 및 클라우드 검증 완료':'⚠ DAY 2는 이 기기에 복구됨 · 클라우드 오류 확인 필요');
 renderAdmin();renderSidebar();
}
async function wmVerifiedCloudSave(reason='verified_save'){
 if(!CloudSync.active)CloudSync.active=true;
 if(!CloudSync.enabled){CloudSync.ready=false;const inited=await CloudSync.init();if(!inited)return false;}
 const uploaded=await CloudSync.upload(reason);if(!uploaded)return false;
 try{
  const remote=await wmWithTimeout(CloudSync.read(),8000,'클라우드 재검증 시간 초과');
  const localDone=completedDayCount();const remoteDone=remote?Object.values(remote.dayDone||{}).filter(Boolean).length:0;
  const localRev=+((S.syncMeta||{}).revision||0),remoteRev=+(((remote||{}).syncMeta||{}).revision||0);
  if(!remote||remoteDone<localDone||remoteRev<localRev)throw new Error(`저장 검증 불일치 (로컬 DAY ${localDone}, 클라우드 DAY ${remoteDone})`);
  CloudSync.lastSyncAt=new Date().toISOString();CloudSync.lastError='';CloudSync.setStatus('online','저장·재검증 완료');renderCloudPanels();return true;
 }catch(e){CloudSync.lastError=String(e&&e.message||e);CloudSync.setStatus('error','클라우드 저장 재검증 실패');renderCloudPanels();return false;}
}
// 빈 상태를 성공 동기화로 오인하지 않도록 초기 동기화 교체
CloudSync.initialSync=async function(){
 const ok=await this.init();this.active=true;if(!ok){this.initialLoaded=true;return false;}
 this.setStatus('syncing','기존 진도 확인 중');
 const remote=await this.read();
 const localHas=wmHasMeaningfulProgress(S),remoteHas=wmHasMeaningfulProgress(remote);
 if(remoteHas){applyMergedRemote(remote,'initial');await this.upload('initial_merged');}
 else if(localHas){await this.upload('first_local_migration');const verified=await wmVerifiedCloudSave('first_local_verified');if(!verified){this.initialLoaded=true;return false;}}
 else{
  this.lastError='로컬·클라우드에 기존 학습기록이 없습니다';
  this.setStatus('needs_recovery','기존 진도 복구 필요');
 }
 this.initialLoaded=true;this.startRealtime();renderCloudPanels();return remoteHas||localHas;
};

// 상태 문구 보강

cloudStatusLabel=function(){if(CloudSync.status==='needs_recovery')return '기존 진도 복구 필요';return wmCloudStatusLabelV12();};
</script>

<script id="wm-v14-continuity-script">
/* ============================================================
   FINAL v14 · 누적 진도 연속성 보강
   - DAY 완료 기준: 당일 배정 단어를 1회 이상 모두 학습하면 완료
   - 오답은 DAY 진행을 막지 않고 별도 복습 큐에 계속 누적
   - 과거 버전에서 전체 분량을 학습했지만 DAY 완료 플래그가 누락된 경우 자동 복구
   - 로컬 이중 백업 + 클라우드 업로드 후 재검증
   - 최근 학습일·누적 분량·현재 상태를 홈과 관리자 화면에 명확히 표시
   ============================================================ */
var WM_FINAL_BUILD='2026-07-26-v14';
var WM_BACKUP_KEY='wm2000_v3_backup';
var WM_BACKUP_AT=0;

function wmCountDone(st){return Object.values((st&&st.dayDone)||{}).filter(Boolean).length;}
function wmLatestIso(){
 var vals=[S&&S.meta&&S.meta.lastSavedAt,S&&S.progress&&S.progress.lastActivityAt];
 Object.values((S&&S.dayRecords)||{}).forEach(function(r){if(r){vals.push(r.lastActivityAt,r.completedAt,r.startedAt);}});
 return vals.filter(Boolean).sort().pop()||'';
}
function wmFmtDateTime(v){if(!v)return '-';try{return new Date(v).toLocaleString('ko-KR');}catch(e){return String(v);}}
function wmDayEvidence(day,st){
 st=st||S;var ws=wordsOf(day),seen=ws.filter(function(w){return !!(((st.seen||{})[w[0]])||((st.legacyCredit||{})[w[0]]));}).length;
 var m=(st.dayMetrics||{})[day]||{},t=(st.dayTime||{})[day]||{},r=(st.dayRecords||{})[day]||{};
 var sessions=(st.sessions||[]).filter(function(x){return +x.day===+day;}).length;
 var last=[r.lastActivityAt,r.completedAt,r.startedAt,(st.dayLog||{})[day]&&((st.dayLog||{})[day].lastStudied)].filter(Boolean).sort().pop()||'';
 return {day:day,seen:seen,total:ws.length,answered:+m.answered||0,seconds:+t.activeSeconds||0,sessions:sessions,last:last,status:r.status||'',done:!!((st.dayDone||{})[day])};
}
function wmRepairContinuityState(target,allowFullCoverageRepair){
 target=target||S;var changed=false,now=new Date().toISOString();
 target.dayDone=target.dayDone||{};target.dayRecords=target.dayRecords||{};target.dayLog=target.dayLog||{};target.progress=target.progress||{};target.meta=target.meta||{};
 for(var d=1;d<=DAYS;d++){
  var ev=wmDayEvidence(d,target),r=target.dayRecords[d]||{};
  var meaningful=ev.seen>0||ev.answered>0||ev.seconds>0||ev.sessions>0||!!r.startedAt;
  if(target.dayDone[d]){
   if(r.status!=='completed'||!r.completedAt){target.dayRecords[d]=Object.assign({},r,{status:'completed',completedAt:r.completedAt||now,lastActivityAt:r.lastActivityAt||r.completedAt||now});changed=true;}
  }else if(allowFullCoverageRepair&&ev.total>0&&ev.seen>=ev.total){
   var pending=wordsOf(d).filter(function(w){return +((target.wrong||{})[w[0]]||0)>0;}).length;
   target.dayDone[d]=true;
   target.dayRecords[d]=Object.assign({},r,{status:'completed',startedAt:r.startedAt||now,completedAt:r.completedAt||now,lastActivityAt:r.lastActivityAt||now,completionMethod:r.completionMethod||'auto_repair_full_coverage',autoRepaired:true,reviewPending:pending,wordsCompleted:ev.seen});
   target.dayLog[d]=target.dayLog[d]||{firstDone:today(),quizzes:0,bestPct:0};target.dayLog[d].completedAt=target.dayLog[d].completedAt||now;target.dayLog[d].lastStudied=target.dayLog[d].lastStudied||today();changed=true;
  }else if(meaningful&&r.status!=='in_progress'){
   target.dayRecords[d]=Object.assign({},r,{status:'in_progress',startedAt:r.startedAt||now,lastActivityAt:r.lastActivityAt||now,wordsCompleted:ev.seen});changed=true;
  }
 }
 var last=0;for(var i=1;i<=DAYS;i++)if(target.dayDone[i])last=i;
 var next=1;for(var j=1;j<=DAYS;j++){if(!target.dayDone[j]){next=j;break;}if(j===DAYS)next=DAYS;}
 if(+target.progress.lastCompletedDay!==last){target.progress.lastCompletedDay=last;changed=true;}
 if(+target.progress.currentDay!==next){target.progress.currentDay=next;changed=true;}
 target.meta.schemaVersion=Math.max(14,+target.meta.schemaVersion||0);target.meta.finalBuild=WM_FINAL_BUILD;
 return changed;
}
function wmWriteLocalBackup(force){
 try{
  var now=Date.now();if(!force&&now-WM_BACKUP_AT<15000)return true;WM_BACKUP_AT=now;
  localStorage.setItem(WM_BACKUP_KEY,JSON.stringify({savedAt:new Date(now).toISOString(),build:WM_FINAL_BUILD,state:S}));return true;
 }catch(e){console.warn('[wm backup] write failed',e);return false;}
}
function wmMergeDiscoveredLocalBackup(){
 try{
  var raw=localStorage.getItem(WM_BACKUP_KEY);if(!raw)return false;var parsed=JSON.parse(raw),candidate=parsed&&parsed.state?parsed.state:parsed;
  if(!candidate||!wmHasMeaningfulProgress(candidate))return false;
  var before=JSON.stringify({seen:S.seen,dayDone:S.dayDone,dayMetrics:S.dayMetrics});
  S=mergeStates(S,candidate);wmRepairContinuityState(S,true);
  return before!==JSON.stringify({seen:S.seen,dayDone:S.dayDone,dayMetrics:S.dayMetrics});
 }catch(e){console.warn('[wm backup] merge failed',e);return false;}
}

/* 저장 전 상태 정규화, 저장 후 이중 백업 */
var wmSaveV13Final=save;
save=function(){wmRepairContinuityState(S,false);var ok=wmSaveV13Final();if(ok)wmWriteLocalBackup(false);return ok;};

/* 클라우드/다른 탭에서 병합한 뒤, 전체 분량 완료 DAY의 누락 플래그 복구 */
var wmApplyMergedRemoteV13Final=applyMergedRemote;
applyMergedRemote=function(remote,reason){wmApplyMergedRemoteV13Final(remote,reason);if(wmRepairContinuityState(S,true)){wmSaveV13Final();wmWriteLocalBackup(true);} };

/* DAY 완료 후 로컬 백업과 Firestore 재검증 */
var wmCompleteDayV13Final=completeDay;
completeDay=function(day,detail){
 detail=detail||{};var pending=dayWrongWords(day).length;
 detail.reviewPending=pending;detail.finalBuild=WM_FINAL_BUILD;
 wmCompleteDayV13Final(day,detail);wmWriteLocalBackup(true);
 if(typeof wmVerifiedCloudSave==='function'&&CloudSync&&CloudSync.active){setTimeout(function(){wmVerifiedCloudSave('day_'+day+'_complete_v14');},0);}
};

/* 핵심 변경: 전체 분량 1회 학습 완료 시 DAY 완료. 오답은 별도 복습 큐로 유지 */
finishDayOrContinue=function(day,completeAfter,remedyDone){
 var dp=dayProgress(day),remaining=dayWrongWords(day),full=dp.total>0&&dp.seen>=dp.total;
 if(completeAfter&&full){
  if(!isDayDone(day))completeDay(day,{completionMethod:'daily_coverage_complete',wrongCorrection:remedyDone?'completed':'review_queue',actualSeconds:actualSeconds(day),wordsCompleted:dp.seen});
  confetti(innerWidth/2,innerHeight*.34,160);
  stage('vQuiz','<div class="result reward-burst"><div class="em">🏆</div><div class="score">DAY '+day+' 완료</div><div class="pct grad-lime">'+fmtActual(actualSeconds(day))+'</div><div class="card" style="margin:16px 0;padding:15px"><b style="color:var(--green)">당일 분량과 누적 진도가 저장되었습니다.</b><div class="mini" style="margin-top:5px">'+(remaining.length?'오답 '+remaining.length+'개는 다음 DAY 진행과 별도로 복습 목록에 유지됩니다.':'현재 남은 오답이 없습니다.')+'</div></div>'+(remaining.length?'<button class="btn btn-lime wfull tablet-action" style="margin-bottom:10px" onclick="startWrongCorrection(dayWrongWords('+day+').map(function(w){return {w:w,dir:\'ko\'};}),'+day+',false)">오답 복습 계속하기</button>':'')+'<button class="btn btn-hero wfull tablet-action" onclick="go(\'Home\')">다음 DAY 확인</button></div>');
  return;
 }
 var left=Math.max(0,dp.total-dp.seen),msg=remaining.length?'현재 오답 '+remaining.length+'개':'남은 새 단어 '+left+'개';
 stage('vQuiz','<div class="result reward-burst"><div class="em">📚</div><div class="score">DAY '+day+' 누적 저장</div><div class="pct grad-txt">'+dp.seen+'/'+dp.total+'</div><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0"><span class="chip cyan">실제 '+fmtActual(actualSeconds(day))+'</span><span class="chip '+(remaining.length?'pink':'lime')+'">'+msg+'</span></div><button class="btn btn-lime wfull tablet-action" style="margin-bottom:10px" onclick="startTodayQuiz('+day+')">계속 학습</button><button class="btn btn-ghost wfull" onclick="exitQuiz()">오늘은 여기까지</button></div>');
};

/* 전체 분량을 이미 마친 상태에서 나가도 DAY 플래그를 놓치지 않음 */
var wmExitQuizV13Final=exitQuiz;
exitQuiz=function(){
 try{if(SESS&&SESS.day&&SESS.kind==='main'&&!isDayDone(SESS.day)){var dp=dayProgress(SESS.day);if(dp.total>0&&dp.seen>=dp.total)completeDay(SESS.day,{completionMethod:'exit_after_full_coverage',wrongCorrection:'review_queue',actualSeconds:actualSeconds(SESS.day),wordsCompleted:dp.seen});}}catch(e){console.warn('[wm] exit finalize failed',e);}
 wmExitQuizV13Final();
};

function wmContinuityBannerHtml(){

<script id="wm-v19-guided-wrong-script">
(function(){
  WM_FINAL_BUILD='2026-07-26-v19';
  function wm19StageEnable(btn,ms){
    if(!btn) return;
    btn.disabled=true;
    btn.classList.remove('wm16-hold');
    setTimeout(function(){
      if(!btn || !document.body.contains(btn)) return;
      btn.disabled=false;
      btn.classList.add('wm16-hold');
      btn.focus();
      if(typeof wm16BindPrimary==='function') wm16BindPrimary(btn);
    }, ms||1100);
  }
  function wm19Esc(v){ return typeof wm15Esc==='function' ? wm15Esc(v) : String(v==null?'':v); }
  function wm19Prompt(w,dir,mode){
    if(mode==='typing-ko') return w[4];
    if(mode==='typing-en') return w[3];
    return dir==='en' ? w[3] : w[4];
  }
  function wm19SelectedLabel(mode){
    if(mode==='typing-ko' || mode==='typing-en') return '내가 입력한 답';
    return '내가 고른 답';
  }
  function wm19CorrectLabel(mode){ return '정답'; }
  function wm19BuildExplain(w,selected,dir,mode,userValue){
    const lines=[];
    if(mode==='typing-ko'){
      lines.push('<b>'+wm19Esc(w[4])+'</b>에 해당하는 영어 표제어는 <b>'+wm19Esc(w[3])+'</b>입니다.');
      lines.push('영어 입력은 철자 전체가 정확히 일치해야 합니다. 입력한 <b>'+wm19Esc(userValue)+'</b>와 정답 <b>'+wm19Esc(w[3])+'</b>를 글자 단위로 다시 보세요.');
      lines.push('지금은 빨리 넘기지 말고 <b>'+wm19Esc(w[4])+' → '+wm19Esc(w[3])+'</b>를 한 세트로 각인합니다.');
    } else if(mode==='typing-en'){
      lines.push('<b>'+wm19Esc(w[3])+'</b>의 교재 뜻은 <b>'+wm19Esc(w[4])+'</b>입니다.');
      lines.push('입력한 뜻 <b>'+wm19Esc(userValue)+'</b>에는 교재의 핵심 의미가 충분히 들어 있지 않습니다.');
      lines.push('지금은 <b>'+wm19Esc(w[3])+' = '+wm19Esc(w[4])+'</b>를 그대로 연결해서 다시 기억합니다.');
    } else if(dir==='en'){
      lines.push('<b>'+wm19Esc(w[3])+'</b>의 교재 뜻은 <b>'+wm19Esc(w[4])+'</b>입니다.');
      if(selected){
        lines.push('선택한 <b>'+wm19Esc(selected[4])+'</b>는 <b>'+wm19Esc(selected[3])+'</b>의 뜻입니다.');
        lines.push('즉, <b>'+wm19Esc(w[3])+'</b>와 <b>'+wm19Esc(selected[3])+'</b>는 서로 다른 단어입니다.');
      }
      lines.push('핵심 연결: <b>'+wm19Esc(w[3])+'</b>를 보면 <b>'+wm19Esc(w[4])+'</b>가 바로 떠올라야 합니다.');
    } else {
      lines.push('교재 뜻 <b>'+wm19Esc(w[4])+'</b>에 해당하는 표제어는 <b>'+wm19Esc(w[3])+'</b>입니다.');
      if(selected){
        lines.push('선택한 <b>'+wm19Esc(selected[3])+'</b>은(는) <b>'+wm19Esc(selected[4])+'</b>라는 뜻입니다.');
        lines.push('즉, <b>'+wm19Esc(w[4])+'</b>를 보고 떠올려야 할 단어는 <b>'+wm19Esc(w[3])+'</b>입니다.');
      }
      lines.push('핵심 연결: <b>'+wm19Esc(w[4])+'</b>를 보면 <b>'+wm19Esc(w[3])+'</b>가 바로 떠올라야 합니다.');
    }
    return lines.map(function(line){ return '<div class="wm19-bullet">'+line+'</div>'; }).join('');
  }
  function wm19BuildMemory(w,selected,dir,mode){
    let main='', note='';
    if(mode==='typing-ko'){
      main='<span class="b">'+wm19Esc(w[4])+'</span> <span style="opacity:.7">→</span> <span class="a">'+wm19Esc(w[3])+'</span>';
      note='뜻을 보면 영어 철자가 한 번에 이어지도록 천천히 읽으세요.';
    } else if(mode==='typing-en'){
      main='<span class="a">'+wm19Esc(w[3])+'</span> <span style="opacity:.7">=</span> <span class="b">'+wm19Esc(w[4])+'</span>';
      note='영어를 보면 교재 뜻이 바로 이어지도록 눈으로 한 번 더 확인하세요.';
    } else if(dir==='en'){
      main='<span class="a">'+wm19Esc(w[3])+'</span> <span style="opacity:.7">=</span> <span class="b">'+wm19Esc(w[4])+'</span>';
      note=selected ? '혼동 주의: <span class="c">'+wm19Esc(selected[3])+'</span> = '+wm19Esc(selected[4]) : '정답 단어와 뜻을 한 세트로 묶어 기억합니다.';
    } else {
      main='<span class="b">'+wm19Esc(w[4])+'</span> <span style="opacity:.7">→</span> <span class="a">'+wm19Esc(w[3])+'</span>';
      note=selected ? '혼동 주의: <span class="c">'+wm19Esc(selected[3])+'</span> = '+wm19Esc(selected[4]) : '뜻을 보면 정답 단어가 즉시 떠오르도록 다시 확인합니다.';
    }
    return '<div class="title">핵심 암기 문장</div><div class="wm19-memory-line">'+main+'</div><div class="wm19-memory-note">'+note+'</div>';
  }
  function wm19RevealFlow(cfg){
    wm15Unbind();
    const w=cfg.w, selected=cfg.selected||null, dir=cfg.dir||'en';
    const prompt=cfg.prompt || wm19Prompt(w,dir,cfg.mode);
    const stepLabels=cfg.stepLabels || ['내가 틀린 답 보기','정답 나타내기','차이 설명 보기','핵심 암기 문장 보기',cfg.finalButton||'이제 눌러서 암기하기'];
    stage('vQuiz',
      '<div class="integrated-card"><div class="integrated-head"><button class="btn btn-ghost sm" onclick="exitQuiz()">← 종료</button><span class="wrong-flag">'+cfg.badge+'</span></div>'+wm15LoopStrip(2)+
      '<div class="wm19-guide-wrap">'+
        '<div class="wm19-step-chip"><span class="n" id="wm19StepNo">1</span><span id="wm19StepText">지금부터 오답을 천천히 확인합니다</span></div>'+
        '<div class="wm19-main-prompt"><div class="label">문제 단서</div><div class="value">'+wm19Esc(prompt)+'</div></div>'+
        '<div class="wm19-status" id="wm19Status">한 번에 모두 보여주지 않습니다. 먼저 무엇을 틀렸는지부터 또렷하게 확인하세요.</div>'+
        '<div class="wm19-reveal-panel" id="wm19Panel"></div>'+
        '<button type="button" class="btn btn-hero one-entry-btn" id="wm19NextBtn"><span class="wm16-count">1</span>'+stepLabels[0]+'</button>'+
      '</div></div>'
    );
    const stepNo=$('#wm19StepNo'),stepText=$('#wm19StepText'),status=$('#wm19Status'),panel=$('#wm19Panel'),btn=$('#wm19NextBtn');
    let step=0;
    function setBtn(index,text){ btn.innerHTML='<span class="wm16-count">'+index+'</span>'+text; }
    function wrongValue(){
      if(cfg.mode==='typing-ko' || cfg.mode==='typing-en') return cfg.userValue || '입력값 없음';
      return selected ? (dir==='en'? selected[4] : selected[3]) : '선택 정보 없음';
    }
    function correctValue(){
      if(cfg.mode==='typing-ko') return w[3];
      if(cfg.mode==='typing-en') return w[4];
      return dir==='en' ? w[4] : w[3];
    }
    function afterWait(ms, nextLabel){ wm19StageEnable(btn,ms||1250); if(nextLabel) setBtn(step+1,nextLabel); }
    wm19StageEnable(btn,950);
    btn.addEventListener('click',function(){
      btn.classList.remove('wm16-hold');
      if(step===0){
        panel.innerHTML='<div class="wm19-choice-box wrong"><div class="k">'+wm19SelectedLabel(cfg.mode)+'</div><div class="v">'+wm19Esc(wrongValue())+'</div></div>';
        stepNo.textContent='1'; stepText.textContent='내가 무엇을 틀렸는지 확인';
        status.textContent='방금 선택하거나 입력한 내용을 먼저 분명하게 봅니다. 바로 넘기지 말고 읽으세요.';
        step=1; afterWait(1150,stepLabels[1]); return;
      }
      if(step===1){
        panel.innerHTML += '<div class="wm19-choice-box correct"><div class="k">'+wm19CorrectLabel(cfg.mode)+'</div><div class="v">'+wm19Esc(correctValue())+'</div></div>';
        stepNo.textContent='2'; stepText.textContent='정답을 또렷하게 보기';
        status.textContent='정답을 크게 보여 줍니다. 눈으로 읽고, 소리 내어 읽을 수 있으면 더 좋습니다.';
        step=2; afterWait(1400,stepLabels[2]); return;
      }
      if(step===2){
        panel.innerHTML += '<div class="wm19-explain-card"><div class="title">왜 틀렸는지 천천히 설명</div>'+wm19BuildExplain(w,selected,dir,cfg.mode,cfg.userValue)+'</div>';
        stepNo.textContent='3'; stepText.textContent='오답 이유 이해';
        status.textContent='정답과 오답의 차이를 문장으로 다시 확인합니다. 이 단계는 이해 단계입니다.';
        step=3; afterWait(1600,stepLabels[3]); return;
      }
      if(step===3){
        panel.innerHTML += '<div class="wm19-memory-card">'+wm19BuildMemory(w,selected,dir,cfg.mode)+'</div>';
        stepNo.textContent='4'; stepText.textContent='핵심 문장으로 각인';
        status.textContent='이제 단어와 뜻을 한 덩어리로 묶어 기억합니다. 충분히 본 뒤 다음으로 이동하세요.';
        step=4; afterWait(1550,stepLabels[4]); return;
      }
      wm15Unbind();
      cfg.onDone();
    }, {once:false});
