<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WORD MASTER 수능 2000 · 18DAY 누적 학습</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{
--bg:#0E1016;--bg2:#151823;--panel:#1B1F2E;--panel2:#222840;
--line:#2A3050;--line2:#3A4270;
--txt:#EEF1FA;--txt2:#9AA3C4;--txt3:#5B6485;
--iris:#6C5CE7;--iris2:#8B7BFF;--cyan:#00E5D4;--lime:#A6FF3D;
--pink:#FF5DA2;--amber:#FFB443;--red:#FF4D6D;--green:#2BE38A;
--grad-hero:linear-gradient(120deg,#6C5CE7 0%,#00E5D4 100%);
--grad-lime:linear-gradient(120deg,#A6FF3D 0%,#00E5D4 100%);
--grad-pink:linear-gradient(120deg,#FF5DA2 0%,#FFB443 100%);
--r-sm:10px;--r:16px;--r-lg:24px;--r-xl:32px;
--disp:'Space Grotesk','Pretendard',sans-serif;
--sans:'Pretendard',-apple-system,sans-serif;
--sb-w:248px;--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(680px 420px at 78% -8%,rgba(108,92,231,.28),transparent 60%),
 radial-gradient(560px 400px at -6% 108%,rgba(0,229,212,.20),transparent 60%),
 radial-gradient(500px 360px at 110% 90%,rgba(255,93,162,.14),transparent 60%);}
.mono,.num{font-family:var(--disp);font-feature-settings:"tnum"}
button{font-family:inherit}
::selection{background:var(--iris);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== LOGIN ===== */
.login-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
background:radial-gradient(900px 600px at 50% 30%,rgba(108,92,231,.25),var(--bg) 70%)}
.login-box{width:min(420px,90vw);text-align:center;animation:vin .5s var(--ease)}
.login-logo{width:76px;height:76px;border-radius:22px;background:var(--grad-hero);display:grid;place-items:center;
font-family:var(--disp);font-weight:700;font-size:34px;color:#fff;margin:0 auto 20px;box-shadow:0 16px 44px rgba(108,92,231,.55)}
.login-title{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:-.8px}
.login-sub{color:var(--txt2);font-size:14px;margin:6px 0 34px}
.pin-display{display:flex;justify-content:center;gap:12px;margin-bottom:28px}
.pin-dot{width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--line2);transition:.2s}
.pin-dot.filled{background:var(--grad-hero);border-color:transparent;transform:scale(1.15)}
.pin-dot.err{background:var(--red);border-color:var(--red);animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto}
.key{aspect-ratio:1.4;border:1px solid var(--line);background:var(--panel);border-radius:18px;
font-family:var(--disp);font-weight:600;font-size:26px;color:var(--txt);cursor:pointer;transition:.15s var(--ease)}
.key:hover{background:var(--panel2);border-color:var(--line2);transform:translateY(-2px)}
.key:active{transform:scale(.94)}
.key.wide{font-size:16px;font-weight:600}
.login-hint{margin-top:26px;font-size:12.5px;color:var(--txt3);line-height:1.9}
.login-hint b{color:var(--txt2)}

/* ===== SHELL ===== */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb-w) 1fr;min-height:100vh}
.shell.hidden{display:none}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));
border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:var(--grad-hero);display:grid;place-items:center;
font-family:var(--disp);font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 24px rgba(108,92,231,.5)}
.brand .bt{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.3px;line-height:1.1}
.brand .bs{font-size:11px;color:var(--txt3);letter-spacing:2px;font-weight:600}
.navlink{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;color:var(--txt2);
font-weight:600;font-size:14.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.2s var(--ease);position:relative}
.navlink svg{width:21px;height:21px;flex-shrink:0}
.navlink:hover{background:var(--panel);color:var(--txt)}
.navlink.on{background:var(--panel2);color:#fff}
.navlink.on::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--grad-hero)}
.navlink .badge-n{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;min-width:20px;text-align:center;font-family:var(--disp)}
.sb-spacer{flex:1}
.role-tag{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.role-tag.learner{background:rgba(108,92,231,.15);color:var(--iris2)}
.role-tag.admin{background:rgba(255,180,67,.14);color:var(--amber)}
.logout-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--txt3);
font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:none;width:100%;transition:.18s}
.logout-btn:hover{color:var(--red);border-color:var(--red)}
.lvl-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}
.lvl-card .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.lvl-badge{width:34px;height:34px;border-radius:11px;background:var(--grad-lime);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#0E1016;font-size:15px}
.lvl-card .lv-title{font-size:12.5px;color:var(--txt2);font-weight:600}
.lvl-card .lv-n{font-family:var(--disp);font-weight:700;font-size:15px}
.xpbar{height:7px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:4px}
.xpbar>i{display:block;height:100%;background:var(--grad-lime);border-radius:20px;transition:width .7s var(--ease)}
.xp-txt{font-size:11px;color:var(--txt3);margin-top:6px;font-family:var(--disp);font-weight:600}

.main{padding:0 40px 80px;max-width:1180px;width:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:20px 0 18px;background:linear-gradient(180deg,var(--bg) 62%,transparent);margin-bottom:8px}
.page-h{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.6px}
.page-sub{color:var(--txt2);font-size:13.5px;margin-top:2px}
.tb-right{display:flex;align-items:center;gap:12px}
.pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);padding:8px 15px;border-radius:20px;font-weight:700;font-size:13.5px}
.pill.fire{color:var(--amber)}.pill.gem{color:var(--cyan)}
.pill .num{font-family:var(--disp)}
.view{display:none;animation:vin .45s var(--ease)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.grid{display:grid;gap:18px}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;position:relative;overflow:hidden}
.card.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad-hero);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.stat-lbl{font-size:12.5px;color:var(--txt2);font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.stat-big{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;margin:10px 0 4px;letter-spacing:-1px}
.grad-txt{background:var(--grad-hero);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-lime{background:var(--grad-lime);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-pink{background:var(--grad-pink);-webkit-background-clip:text;background-clip:text;color:transparent}
.mini{font-size:12.5px;color:var(--txt3)}
.progline{height:10px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:14px;position:relative}
.progline>i{display:block;height:100%;background:var(--grad-hero);border-radius:20px;transition:width .8s var(--ease);box-shadow:0 0 18px rgba(108,92,231,.6);position:relative}
.progline>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 2.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(200%)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border:none;border-radius:15px;font-weight:700;font-size:15px;cursor:pointer;transition:.2s var(--ease);position:relative;overflow:hidden}
.btn-hero{background:var(--grad-hero);color:#fff;box-shadow:0 10px 30px rgba(108,92,231,.45)}
.btn-hero:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(108,92,231,.6)}
.btn-hero:active{transform:translateY(0) scale(.98)}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
.btn-ghost:hover{background:var(--line);transform:translateY(-2px)}
.btn-lime{background:var(--grad-lime);color:#0E1016}
.btn-lime:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(166,255,61,.4)}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;box-shadow:none!important}
.btn.wfull{width:100%}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:12px}
.btn.lg{padding:20px 28px;font-size:18px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;font-family:var(--disp)}
.chip.iris{background:rgba(108,92,231,.18);color:var(--iris2)}
.chip.cyan{background:rgba(0,229,212,.15);color:var(--cyan)}
.chip.lime{background:rgba(166,255,61,.16);color:var(--lime)}
.chip.pink{background:rgba(255,93,162,.16);color:var(--pink)}
.chip.gray{background:var(--bg);color:var(--txt3)}
.chip.green{background:rgba(43,227,138,.15);color:var(--green)}
.chip.amber{background:rgba(255,180,67,.16);color:var(--amber)}

/* learner big day hero */
.day-hero{background:linear-gradient(150deg,rgba(108,92,231,.3),rgba(0,229,212,.12),var(--panel));
border:1px solid var(--line2);border-radius:var(--r-xl);padding:40px;text-align:center;position:relative;overflow:hidden;margin-bottom:20px}
.day-hero::after{content:"";position:absolute;top:-40%;right:-10%;width:340px;height:340px;border-radius:50%;
background:radial-gradient(circle,rgba(108,92,231,.35),transparent 70%);pointer-events:none}
.day-hero .eyebrow{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase}
.day-hero .daynum{font-family:var(--disp);font-weight:700;font-size:96px;line-height:1;letter-spacing:-3px;margin:6px 0}
.day-hero .dtot{font-size:15px;color:var(--txt2);margin-bottom:26px}
.day-hero .cta{position:relative;z-index:2}

.daygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.daycell{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:.22s var(--ease);overflow:hidden}
.daycell:hover{transform:translateY(-4px) scale(1.04);border-color:var(--line2);background:var(--panel2);z-index:2}
.daycell .dn{font-family:var(--disp);font-weight:700;font-size:19px}
.daycell .dp{font-size:9.5px;color:var(--txt3);font-family:var(--disp);font-weight:600}
.daycell .ring{position:absolute;bottom:0;left:0;height:3px;background:var(--grad-hero);transition:width .6s var(--ease)}
.daycell.done{border-color:var(--green);background:rgba(43,227,138,.1)}
.daycell.done .dn{color:var(--green)}
.daycell.done::before{content:"✓";position:absolute;top:6px;right:8px;color:var(--green);font-weight:800;font-size:12px}
.daycell.partial .dn{color:var(--iris2)}
.daycell.today-mark{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,229,212,.3)}
.daycell.locked{opacity:.32;cursor:not-allowed;filter:grayscale(.55)}
.daycell.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.daycell.locked::after{content:"🔒";position:absolute;top:6px;right:7px;font-size:11px;opacity:.8}

/* quiz */
.q-stage{max-width:680px;margin:0 auto}
.q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.q-prog{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--txt2)}
.combo{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--amber);opacity:0;transform:scale(.6);transition:.25s var(--ease)}
.combo.show{opacity:1;transform:scale(1)}
.q-word{font-family:var(--disp);font-weight:700;font-size:46px;text-align:center;margin:6px 0 4px;letter-spacing:-1px}
.q-sub{text-align:center;color:var(--txt3);font-size:13px;margin-bottom:22px;font-weight:600}
.opts{display:grid;gap:12px}
.opt{padding:19px 22px;border:1px solid var(--line);background:var(--panel);border-radius:16px;font-size:17px;font-weight:600;text-align:left;cursor:pointer;transition:.18s var(--ease);color:var(--txt);position:relative}
.opt:hover:not(:disabled){border-color:var(--iris);background:var(--panel2);transform:translateX(4px)}
.opt.correct{border-color:var(--green);background:rgba(43,227,138,.14);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,77,109,.14);color:var(--red)}
.opt:disabled{cursor:default}
.opt .kbd{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-family:var(--disp);font-size:12px;color:var(--txt3);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
/* 주관식 */
.sa-input{width:100%;padding:20px 22px;border:2px solid var(--line);background:var(--panel);border-radius:16px;
font-size:22px;font-weight:600;color:var(--txt);font-family:var(--sans);text-align:center;transition:.18s}
.sa-input:focus{outline:none;border-color:var(--iris);background:var(--panel2)}
.sa-feedback{text-align:center;margin-top:16px;font-weight:700;font-size:15px;min-height:24px}
.sa-answer{margin-top:10px;padding:14px;background:var(--bg);border-radius:12px;text-align:center;font-size:15px}
.sa-answer b{color:var(--cyan)}

.result{max-width:520px;margin:20px auto;text-align:center}
.result .em{font-size:76px;margin-bottom:6px;animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.result .score{font-family:var(--disp);font-weight:700;font-size:30px}
.result .pct{font-family:var(--disp);font-weight:700;font-size:60px;letter-spacing:-2px;margin:4px 0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.seg button{padding:10px 20px;border:none;background:none;border-radius:10px;font-weight:700;font-size:14px;color:var(--txt2);cursor:pointer;transition:.18s var(--ease);font-family:var(--sans)}
.seg button.on{background:var(--panel2);color:#fff}
.wlist{display:grid;gap:10px}
.wrow{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:15px;transition:.18s var(--ease)}
.wrow:hover{border-color:var(--line2);transform:translateX(3px)}
.wrow .w{font-family:var(--disp);font-weight:700;font-size:18px}
.wrow .m{font-size:13.5px;color:var(--txt2);margin-top:1px}
.wrow .rt{display:flex;align-items:center;gap:10px}
.icon-btn{background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:11px;cursor:pointer;color:var(--txt2);font-size:16px;transition:.18s;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--line2);color:var(--txt)}

/* admin */
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.akpi{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.akpi .lbl{font-size:12px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.akpi .v{font-family:var(--disp);font-weight:700;font-size:34px;margin-top:8px;letter-spacing:-1px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:24px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 24px;font-size:13.5px}
th{color:var(--txt3);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{border-bottom:1px solid var(--bg2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
td .num,th .num{font-family:var(--disp)}
.bar-cell{display:flex;align-items:center;gap:10px}
.bar-cell .track{flex:1;height:7px;background:var(--bg);border-radius:20px;overflow:hidden;min-width:80px}
.bar-cell .track>i{display:block;height:100%;background:var(--grad-hero);border-radius:20px}
.admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.mail-note{background:rgba(0,229,212,.08);border:1px solid rgba(0,229,212,.25);border-radius:16px;padding:16px 20px;font-size:13px;color:var(--txt2);margin-bottom:20px;line-height:1.7}
.mail-note b{color:var(--cyan)}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bg2)}
.cfg-row:last-child{border-bottom:none}
.cfg-label{font-weight:600;font-size:14.5px}
.cfg-desc{font-size:12px;color:var(--txt3);margin-top:2px}
.ratio-wrap{display:flex;align-items:center;gap:14px;margin-top:6px}
.ratio-bar{flex:1;height:40px;border-radius:12px;overflow:hidden;display:flex;border:1px solid var(--line)}
.ratio-bar .en{background:linear-gradient(90deg,var(--iris),var(--iris2));display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:13px;color:#fff;transition:.3s var(--ease)}
.ratio-bar .ko{background:linear-gradient(90deg,var(--cyan),#00b8a9);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:13px;color:#052; transition:.3s var(--ease)}
.slider{width:100%;-webkit-appearance:none;height:8px;border-radius:20px;background:var(--line);outline:none;margin:10px 0}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--grad-hero);cursor:pointer;box-shadow:0 4px 12px rgba(108,92,231,.5)}
.slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#6C5CE7;cursor:pointer;border:none}
.select-box{width:100%;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--txt);font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
.select-box:focus{outline:none;border-color:var(--iris)}
.num-input{width:90px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;font-weight:700;font-family:var(--disp);text-align:center}
.num-input:focus{outline:none;border-color:var(--iris)}
.toggle{position:relative;width:52px;height:30px;border-radius:20px;background:var(--line);cursor:pointer;transition:.2s;border:none;flex-shrink:0}
.toggle.on{background:var(--iris)}

<script>/* ===== WORDS:[id,day,no,word,mean] · 30일 ===== */
const DAYS=18,TOTAL=WORDS.length;
/* 원본 데이터 보존: w[5]=원본 DAY, w[6]=원본 DAY 내 번호 */

const balancedCounts=(total,days)=>Array.from({length:days},(_,i)=>Math.floor(total/days)+(i<total%days?1:0));
const DAY_WORD_COUNTS=balancedCounts(TOTAL,DAYS);
let _wmCursor=0;
for(let d=1;d<=DAYS;d++)for(let n=1;n<=DAY_WORD_COUNTS[d-1];n++){
 const w=WORDS[_wmCursor++];if(w){w[1]=d;w[2]=n;}
}
/* 현재 소스에 ROOT 배열이 있으면 자동 계수·18DAY 배분, 없으면 0으로 명시 */
const ROOT_DATA_SOURCE=Array.isArray(globalThis.ROOTS)?globalThis.ROOTS:(Array.isArray(globalThis.ROOT_DATA)?globalThis.ROOT_DATA:[]);
const ROOT_TOTAL=ROOT_DATA_SOURCE.length;
const DAY_ROOT_COUNTS=balancedCounts(ROOT_TOTAL,DAYS);
const ADMIN_EMAIL='sk01197375068@gmail.com';
const PW_LEARNER='8081',PW_ADMIN='2007';
const EMAILJS_SERVICE_ID='service_v23hns6';
const EMAILJS_TEMPLATE_ID='template_v2zb8ni';
const EMAILJS_PUBLIC_KEY='JJdWMghPhZrilD_ZQ';
const byId={};WORDS.forEach(w=>byId[w[0]]=w);
const wordsOf=d=>WORDS.filter(w=>w[1]===d);
let emailJSReady=false;
function initEmailJS(){if(window.emailjs){try{emailjs.init(EMAILJS_PUBLIC_KEY);emailJSReady=true;}catch(e){}}}

/* ===== 역할 ===== */
let ROLE=null; // 'learner' | 'admin'

/* ===== state ===== */
const KEY='wm2000_v3';
const defState=()=>({
 seen:{},mastered:{},wrong:{},fav:{},dayDone:{},dayRecords:{},
 progress:{currentDay:1,lastCompletedDay:0,lastCompletedAt:'',lastActivityAt:''},
 meta:{schemaVersion:7,lastSavedAt:''},
 streak:0,lastDate:'',xp:0,
 quizStat:{done:0,correct:0},
 history:[],daily:{},dayLog:{},
 sessions:[],   // 로그인/시험 세션 기록 {login, logout, dur, day, type, correct, total}
 adminActions:[], // 관리자 강제 수료 등 관리 이력
 // 관리자 설정
 config:{
  quizMode:'mc',        // 'mc'(객관식) | 'sa'(주관식)
  enPct:50,             // 영→한 비율(%), 나머지는 한→영
  quizCount:0,          // 문제 수 (0 = 그날 단어 전체 출제)
  saThreshold:80        // 주관식 유사도 임계(%)
 },
 wrongDetail:{}  // day -> [{id, wrongCount}]  A4 오답표기용
});
let S;let storageOK=true;
function normalizeState(){
 const d=defState();for(const k in d)if(!(k in S))S[k]=d[k];
 for(const k in d.config)if(S.config[k]===undefined)S.config[k]=d.config[k];
 if(!S.dayRecords||typeof S.dayRecords!=='object')S.dayRecords={};
 if(!S.progress||typeof S.progress!=='object')S.progress={...d.progress};
 if(!S.meta||typeof S.meta!=='object')S.meta={...d.meta};
 if(!Array.isArray(S.adminActions))S.adminActions=[];
 // 마이그레이션: 옛 기본값(10문제) 사용자는 전체 출제로 전환
 if(!S._migrated_v4){if(S.config.quizCount===10)S.config.quizCount=0;S._migrated_v4=true;}
 // v6: DAY 완료 여부를 단어 seen과 분리하고, 기존 시험 기록을 DAY 완료 기록으로 복구
 if((S.meta.schemaVersion||0)<6){
  for(let day=1;day<=DAYS;day++){
   const full=wordsOf(day).length>0&&wordsOf(day).every(w=>S.seen[w[0]]);
   const hadQuiz=(S.dayLog[day]&&S.dayLog[day].quizzes>0)||S.sessions.some(x=>+x.day===day&&+x.total>0);
   if(S.dayDone[day]||full||hadQuiz){
    S.dayDone[day]=true;
    const old=S.dayRecords[day]||{};
    S.dayRecords[day]={...old,status:'completed',completedAt:old.completedAt||(S.dayLog[day]&&S.dayLog[day].lastStudied)||'' ,migrated:true};
   }
  }
  S.meta.schemaVersion=6;
 }
 // v7: 관리자 강제 수료 이력 및 완료 방식 기록 지원
 if((S.meta.schemaVersion||0)<7){
  if(!Array.isArray(S.adminActions))S.adminActions=[];
  S.meta.schemaVersion=7;
 }
 S.progress.currentDay=currentDay();
 let last=0;for(let day=1;day<=DAYS;day++)if(S.dayDone[day])last=day;
 S.progress.lastCompletedDay=Math.max(S.progress.lastCompletedDay||0,last);
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||defState();}catch(e){S=defState();storageOK=false;}
 normalizeState();save();}
function save(){try{
 S.meta=S.meta||{};S.meta.lastSavedAt=new Date().toISOString();
 const payload=JSON.stringify(S);localStorage.setItem(KEY,payload);
 if(localStorage.getItem(KEY)!==payload)throw new Error('저장 검증 실패');
 storageOK=true;return true;
 }catch(e){storageOK=false;console.error('진도 저장 실패',e);return false;}}
load();
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});

/* ===== 로그인 세션 추적 ===== */
let loginTime=null;
function startSession(){loginTime=Date.now();}
function recordQuizSession(day,type,correct,total,startMs){
 const dur=Math.round((Date.now()-startMs)/1000);
 S.sessions.unshift({login:new Date(startMs).toISOString(),logout:new Date().toISOString(),dur,day,type,correct,total});
 if(S.sessions.length>300)S.sessions.length=300;save();}

/* ===== level ===== */
const LEVELS=[[0,'새싹'],[100,'입문'],[300,'수련생'],[600,'실력자'],[1000,'준마스터'],[1600,'마스터'],[2400,'그랜드마스터'],[3500,'전설']];
function levelInfo(){let lv=1,name='새싹',cur=0,next=100;
 for(let i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){lv=i+1;name=LEVELS[i][1];cur=LEVELS[i][0];next=LEVELS[i+1]?LEVELS[i+1][0]:LEVELS[i][0]+1200;}}
 const span=next-cur,into=S.xp-cur;return{lv,name,cur,next,pct:Math.min(100,Math.round(into/span*100)),into,span};}
function addXP(n,x,y){const before=levelInfo().lv;S.xp+=n;const t=today();
 S.daily[t]=S.daily[t]||{studied:0,quizzed:0,correct:0,xp:0};S.daily[t].xp+=n;save();floatXP(n,x,y);renderSidebar();
 if(levelInfo().lv>before)levelUp(levelInfo().lv);}

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function touchStreak(){const t=today();if(S.lastDate===t)return;
 const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
 S.streak=(S.lastDate===ys)?S.streak+1:1;S.lastDate=t;save();}
function markDaily(k){const t=today();S.daily[t]=S.daily[t]||{studied:0,quizzed:0,correct:0,xp:0};S.daily[t][k]=(S.daily[t][k]||0)+1;save();}

/* ===== utils ===== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
const seenCount=()=>new Set([...Object.keys(S.seen||{}),...Object.keys(S.legacyCredit||{})]).size;
const masteredCount=()=>Object.values(S.mastered).filter(v=>v>=2).length;
const wrongList=()=>Object.keys(S.wrong).filter(id=>S.wrong[id]>0).map(id=>byId[+id]).filter(Boolean);
const favList=()=>Object.keys(S.fav).filter(id=>S.fav[id]).map(id=>byId[+id]).filter(Boolean);
function dayProgress(d){const ws=wordsOf(d);return{seen:ws.filter(w=>S.seen[w[0]]).length,total:ws.length};}
function isDayDone(d){return !!(S.dayDone&&S.dayDone[d]);}
function completedDayCount(){let n=0;for(let d=1;d<=DAYS;d++)if(isDayDone(d))n++;return n;}
function firstUnfinishedDay(){for(let d=1;d<=DAYS;d++)if(!isDayDone(d))return d;return DAYS;}
function currentDay(){return firstUnfinishedDay();}
function startDay(day,method){
 const now=new Date().toISOString(),r=S.dayRecords[day]||{};
 if(!isDayDone(day))S.dayRecords[day]={...r,status:'in_progress',startedAt:r.startedAt||now,lastActivityAt:now,lastMethod:method};
 S.progress.currentDay=currentDay();S.progress.lastActivityAt=now;save();
}
function completeDay(day,detail={}){
 const now=new Date().toISOString(),r=S.dayRecords[day]||{};
 S.dayDone[day]=true;
 S.dayRecords[day]={...r,...detail,status:'completed',startedAt:r.startedAt||now,completedAt:now,lastActivityAt:now};
 S.dayLog[day]=S.dayLog[day]||{firstDone:today(),quizzes:0,bestPct:0};
 S.dayLog[day].completedAt=now;S.dayLog[day].lastStudied=today();
 S.progress.lastCompletedDay=Math.max(S.progress.lastCompletedDay||0,day);
 S.progress.lastCompletedAt=now;S.progress.currentDay=currentDay();S.progress.lastActivityAt=now;save();
}

/* ===== 관리자 DAY 강제 수료 ===== */
function adminForceCompleteThrough(){
 if(ROLE!=='admin'){toast('관리자 권한이 필요합니다');return;}
 const sel=$('#adminForceDay');
 const through=sel?Math.max(1,Math.min(DAYS,parseInt(sel.value,10)||1)):currentDay();
 const targets=[];for(let d=1;d<=through;d++)if(!isDayDone(d))targets.push(d);
 if(!targets.length){toast(`DAY ${through}까지 이미 수료 완료 상태입니다`);return;}
 const msg=`DAY 1부터 DAY ${through}까지 미완료 ${targets.length}개 DAY를 관리자 권한으로 수료 완료 처리합니다.\n\n단어 학습률·정답률·오답 기록은 변경하지 않고, DAY 완료 상태와 다음 DAY 개방만 처리합니다.\n\n계속하시겠습니까?`;
 if(!window.confirm(msg))return;
 const now=new Date().toISOString();
 targets.forEach(day=>{
  const r=S.dayRecords[day]||{};
  S.dayDone[day]=true;
  S.dayRecords[day]={...r,status:'completed',startedAt:r.startedAt||now,completedAt:now,lastActivityAt:now,
   completionMethod:'admin_force',forced:true,forcedAt:now,forcedBy:'admin',forceScope:`DAY 1~${through}`};
  S.dayLog[day]=S.dayLog[day]||{firstDone:today(),quizzes:0,bestPct:0};
  S.dayLog[day].completedAt=now;S.dayLog[day].lastStudied=today();S.dayLog[day].adminForced=true;
 });

/* ===== 한글 유사도 (주관식 채점) ===== */
// 뜻 문자열을 정답 후보 배열로 분해: 콤마/대괄호/괄호 분리
function meaningVariants(mean){
 let variants=[];
 // "발달[발전]하다" → 발달하다, 발전하다
 const expandBracket=s=>{const m=s.match(/(.*)\[(.+?)\](.*)/);if(!m)return [s];
  const base=m[1],alt=m[2],tail=m[3];return [base+tail, base.slice(0,base.length)+alt+tail].map(x=>x.trim());};
 mean.split(/[,;/]/).forEach(part=>{part=part.trim();if(!part)return;
  // (~) 제거, ~ 제거
  part=part.replace(/\([^)]*\)/g,'').replace(/[~\.]/g,'').trim();
  if(!part)return;
  expandBracket(part).forEach(v=>{v=v.trim();if(v)variants.push(v);});
 });
 return [...new Set(variants)];
}
function normKo(s){return (s||'').replace(/\s+/g,'').replace(/[.,~\-()[\]]/g,'').replace(/하다$|하기$|다$|되다$/,'').trim();}
// 유사도: 정규화 후 부분포함 + 자소 유사(레벤슈타인 기반 비율)
function levenshtein(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
 const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)dp[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return dp[m][n];}
function simRatio(a,b){if(!a||!b)return 0;const d=levenshtein(a,b);return 1-d/Math.max(a.length,b.length);}
// 사용자 입력이 정답 뜻과 임계% 이상 유사한지
function checkAnswer(userInput,meanStr){
 const th=(S.config.saThreshold||80)/100;
 const u=normKo(userInput);if(!u)return {ok:false,score:0};
 const variants=meaningVariants(meanStr);
 let best=0;
 for(const v of variants){const nv=normKo(v);if(!nv)continue;
  // 완전일치 or 포함
  if(u===nv||nv.includes(u)&&u.length>=2||u.includes(nv)&&nv.length>=2){best=1;break;}
  best=Math.max(best,simRatio(u,nv));
 }
 return {ok:best>=th,score:Math.round(best*100)};
}

function confetti(x,y,n=90){const L=$('#fxLayer');const cols=['#6C5CE7','#00E5D4','#A6FF3D','#FF5DA2','#FFB443','#2BE38A'];
 for(let i=0;i<n;i++){const c=el('div','confetti');c.style.background=cols[i%cols.length];c.style.left=x+'px';c.style.top=y+'px';
  const ang=Math.random()*Math.PI*2,vel=6+Math.random()*10,vx=Math.cos(ang)*vel,vy=Math.sin(ang)*vel-8;L.appendChild(c);let t=0;
  const tick=()=>{t++;c.style.transform=`translate(${vx*t}px,${vy*t+t*t*0.55}px) rotate(${t*18}deg)`;c.style.opacity=Math.max(0,1-t/60);if(t<60)requestAnimationFrame(tick);else c.remove();};requestAnimationFrame(tick);}}
function floatXP(n,x,y){if(x==null){x=innerWidth/2;y=innerHeight/2;}const f=el('div','xp-float','+'+n+' XP');f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);
 let t=0;const tick=()=>{t++;f.style.transform=`translateY(${-t*1.4}px)`;f.style.opacity=Math.max(0,1-t/45);if(t<45)requestAnimationFrame(tick);else f.remove();};requestAnimationFrame(tick);}

function pickDayForQuiz(){const cd=currentDay();
 $('#vQuiz').innerHTML=`<div style="max-width:480px;margin:0 auto"><div class="card">
   <div style="font-family:var(--disp);font-weight:700;font-size:18px;margin-bottom:12px">DAY 선택</div>

   <button class="btn btn-hero wfull" onclick="startTodayQuiz(+document.getElementById('qDaySel').value)">시험 시작</button>
   <button class="btn btn-ghost wfull" style="margin-top:10px" onclick="go('Quiz')">← 뒤로</button>
 </div></div>`;
}
// 오늘의 시험: 설정 기반 문항 생성
function startTodayQuiz(day){touchStreak();
 const assignedDay=currentDay();if(day>assignedDay&&!isDayDone(day)){toast(`DAY ${assignedDay}를 먼저 완료하세요`);go('Study');return;}
 startDay(day,'quiz');
 const pool=wordsOf(day);const N=S.config.quizCount>0?Math.min(S.config.quizCount,pool.length):pool.length;
 const chosen=shuffle(pool).slice(0,N);
 // 영한/한영 방향 배정
 const enCnt=Math.round(N*S.config.enPct/100);
 const dirs=shuffle([...Array(enCnt).fill('en'),...Array(N-enCnt).fill('ko')]);
 const qs=shuffle(chosen).map((w,i)=>({w,dir:dirs[i]||'en'}));
 SESS={mode:S.config.quizMode,day,qs,i:0,correct:0,combo:0,maxCombo:0,wrongThis:[],gained:0,startMs:Date.now(),assignedAtStart:day===assignedDay&&!isDayDone(day)};
 $('#pgTitle').textContent='시험';$('#pgSub').textContent=`DAY ${day}`;
 if(SESS.mode==='sa')renderSA();else renderMC();
}
function renderMC(){const {qs,i,correct,combo}=SESS;const {w,dir}=qs[i];
 // dir 'en' => 영단어 보고 뜻 선택 / 'ko' => 뜻 보고 단어 선택
 const distract=shuffle(WORDS.filter(x=>x[0]!==w[0])).slice(0,3);
 const opts=shuffle([w,...distract]);
 const q=dir==='en'?w[3]:w[4];const label=dir==='en'?'이 단어의 뜻은?':'이 뜻을 가진 단어는?';
 stage('vQuiz',`<div class="q-stage">
   <div class="q-head"><button class="btn btn-ghost sm" onclick="exitQuiz()">← 나가기</button>
     <div style="display:flex;align-items:center;gap:14px"><span class="combo ${combo>=2?'show':''}">🔥 ${combo} COMBO</span><div class="q-prog">정답 <span class="num">${correct}</span> · <span class="num">${i+1}/${qs.length}</span></div></div></div>
   <div class="progline"><i style="width:${i/qs.length*100}%"></i></div>
   <div class="card" style="margin-top:18px"><div class="q-sub">${label} <span style="color:${dir==='en'?'var(--iris2)':'var(--cyan)'}">[${dir==='en'?'영→한':'한→영'}]</span></div>
     <div class="q-word">${q}</div>
     <div class="opts" id="opts">${opts.map((o,k)=>`<button class="opt" data-id="${o[0]}">${dir==='en'?o[4]:o[3]}<span class="kbd">${k+1}</span></button>`).join('')}</div></div>
 </div>`);
 $('#opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickMC(b,w));bindKeys();
}
function pickMC(btn,w){const opts=$('#opts');if(opts.dataset.lock)return;opts.dataset.lock=1;
 const ok=+btn.dataset.id===w[0];
 opts.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.id===w[0])b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});
 gradeAnswer(w,ok,btn);setTimeout(nextQ,700);
}
function renderSA(){const {qs,i,correct}=SESS;const {w,dir}=qs[i];
 const q=dir==='en'?w[3]:w[4];const label=dir==='en'?'이 단어의 뜻을 쓰세요':'이 뜻의 영어 단어를 쓰세요';
 stage('vQuiz',`<div class="q-stage">
   <div class="q-head"><button class="btn btn-ghost sm" onclick="exitQuiz()">← 나가기</button><div class="q-prog">정답 <span class="num">${correct}</span> · <span class="num">${i+1}/${qs.length}</span></div></div>
   <div class="progline"><i style="width:${i/qs.length*100}%"></i></div>
   <div class="card" style="margin-top:18px"><div class="q-sub">${label} <span style="color:${dir==='en'?'var(--iris2)':'var(--cyan)'}">[${dir==='en'?'영→한':'한→영'}]</span></div>
     <div class="q-word">${q}</div>
     <input class="sa-input" id="saInput" placeholder="정답 입력 후 Enter" autocomplete="off" autofocus>
     <div class="sa-feedback" id="saFb"></div>
     <div id="saAns"></div>
     <button class="btn btn-hero wfull" style="margin-top:16px" id="saSubmit" onclick="submitSA()">제출 (Enter)</button>
   </div>
 </div>`);
 const inp=$('#saInput');inp.focus();
 // Enter: 미제출이면 제출, 제출후면 다음 문제로 (손 안 떼고 끊김없이 진행)
 saEnterHandler=e=>{if(e.key==='Enter'){e.preventDefault();const i=$('#saInput');if(i&&i.dataset.done)nextQ();else submitSA();}};
 inp.onkeydown=saEnterHandler;
}
function submitSA(){const inp=$('#saInput');if(!inp||inp.dataset.done)return nextQ();
 const {w,dir}=SESS.qs[SESS.i];const val=inp.value.trim();if(!val){toast('답을 입력하세요');return;}
 inp.dataset.done=1;inp.disabled=true;
 let ok,score,correctAns;
 if(dir==='en'){const r=checkAnswer(val,w[4]);ok=r.ok;score=r.score;correctAns=w[4];}
 else{ // 한→영: 영어 스펠링 유사도
  const u=val.toLowerCase().replace(/\s/g,'');const t=w[3].toLowerCase().replace(/\s/g,'');
  score=Math.round(simRatio(u,t)*100);ok=(u===t)||score>=(S.config.saThreshold||80);correctAns=w[3];}
 const fb=$('#saFb');fb.style.color=ok?'var(--green)':'var(--red)';
 fb.textContent=ok?`✓ 정답! (유사도 ${score}%)`:`✗ 오답 (유사도 ${score}%)`;
 $('#saAns').innerHTML=`<div class="sa-answer">정답: <b>${correctAns}</b> · Enter를 누르면 다음 문제</div>`;
 const btn=$('#saSubmit');btn.textContent='다음 → (Enter)';btn.onclick=nextQ;btn.focus();
 // 제출 후에도 Enter로 넘어가도록 document 레벨 백업 핸들러
 document.addEventListener('keydown',saEnterHandler);
 gradeAnswer(w,ok,btn);
}
function gradeAnswer(w,ok,btn){if(!S.seen[w[0]])S.seen[w[0]]=true;
 if(ok){SESS.correct++;SESS.combo++;SESS.maxCombo=Math.max(SESS.maxCombo,SESS.combo);
  S.mastered[w[0]]=(S.mastered[w[0]]||0)+1;if(S.mastered[w[0]]>=2&&S.wrong[w[0]])S.wrong[w[0]]=0;
  const gain=10+Math.min(15,(SESS.combo-1)*3);SESS.gained+=gain;
  const r=btn.getBoundingClientRect();addXP(gain,r.right-40,r.top);
  if(SESS.combo>=3)confetti(r.left+r.width/2,r.top,40);
 }else{SESS.combo=0;S.mastered[w[0]]=0;S.wrong[w[0]]=(S.wrong[w[0]]||0)+1;SESS.wrongThis.push(w);}
 save();renderSidebar();
}
function nextQ(){if(saEnterHandler){document.removeEventListener('keydown',saEnterHandler);}
 if(SESS.i===SESS.qs.length-1){finishQuiz();return;}SESS.i++;SESS.mode==='sa'?renderSA():renderMC();}
function exitQuiz(){unbindKeys();ROLE==='learner'?go('Home'):go('Home');}
function finishQuiz(){unbindKeys();if(saEnterHandler){document.removeEventListener('keydown',saEnterHandler);saEnterHandler=null;}const {qs,day,correct,maxCombo,wrongThis,gained,mode,startMs}=SESS;const pct=Math.round(correct/qs.length*100);
 S.quizStat.done+=qs.length;S.quizStat.correct+=correct;markDaily('quizzed');
 const t=today();S.daily[t].correct=(S.daily[t].correct||0)+correct;
 S.dayLog[day]=S.dayLog[day]||{firstDone:today(),quizzes:0,bestPct:0};S.dayLog[day].quizzes++;S.dayLog[day].bestPct=Math.max(S.dayLog[day].bestPct||0,pct);S.dayLog[day].lastStudied=today();
 S.history.unshift({date:new Date().toISOString(),type:mode==='sa'?'주관식':'시험',day,correct,total:qs.length,xp:gained});if(S.history.length>200)S.history.length=200;
 recordQuizSession(day,mode==='sa'?'주관식':'객관식',correct,qs.length,startMs);
 if(SESS.assignedAtStart)completeDay(day,{completionMethod:'quiz',quizMode:mode,correct,total:qs.length,pct});else save();
 const em=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'💪':'📚';if(pct>=70)confetti(innerWidth/2,innerHeight*0.35,120);
 stage('vQuiz',`<div class="result"><div class="em">${em}</div><div class="pct grad-txt">${pct}%</div>
   <div class="score"><span class="num">${correct}</span> / <span class="num">${qs.length}</span> 정답</div>
   <div style="display:flex;justify-content:center;gap:10px;margin:14px 0 14px"><span class="chip lime">+${gained} XP</span>${maxCombo>=2?`<span class="chip pink">🔥 ${maxCombo} 콤보</span>`:''}${wrongThis.length?`<span class="chip gray">오답 ${wrongThis.length}</span>`:`<span class="chip green">퍼펙트</span>`}</div>
   ${SESS.assignedAtStart?`<div class="card" style="padding:14px 18px;margin:0 0 18px;border-color:rgba(43,227,138,.45);background:rgba(43,227,138,.08)"><b style="color:var(--green)">✓ DAY ${day} 완료 저장</b><div class="mini" style="margin-top:3px">다음 학습은 DAY ${currentDay()}입니다.</div></div>`:''}
   <button class="btn btn-hero wfull" style="margin-bottom:12px" onclick="go('Home')">홈으로</button>
   ${wrongThis.length?`<button class="btn btn-ghost wfull" onclick="go('Review')">오답노트 (${wrongThis.length})</button>`:''}
 </div>`);
}
let keyHandler=null;
function bindKeys(){unbindKeys();keyHandler=e=>{const o=$('#opts');if(!o||o.dataset.lock)return;const n=parseInt(e.key);if(n>=1&&n<=4){const b=o.querySelectorAll('.opt')[n-1];if(b)b.click();}};document.addEventListener('keydown',keyHandler);}
function unbindKeys(){if(keyHandler){document.removeEventListener('keydown',keyHandler);keyHandler=null;}}

function renderReview(){const v=$('#vReview');
 v.innerHTML=`<div class="seg" id="rSeg"><button class="on" data-r="wrong">오답 (${wrongList().length})</button><button data-r="fav">즐겨찾기 (${favList().length})</button></div><div id="rBox"></div>`;
 const seg=$('#rSeg'),box=$('#rBox');
 const draw=mode=>{const list=mode==='wrong'?wrongList():favList();box.innerHTML='';
  if(!list.length){box.appendChild(el('div','empty',`<div class="i">${mode==='wrong'?'✅':'☆'}</div>${mode==='wrong'?'오답이 없어요!':'즐겨찾기가 없어요'}`));return;}
  if(mode==='wrong'&&list.length>=4){const b=el('button','btn btn-hero','오답 '+list.length+'단어 집중 시험 →');b.style.marginBottom='16px';
   b.onclick=()=>{SESS_wrong(list);};box.appendChild(b);}
  const wl=el('div','wlist');list.forEach(w=>{const r=el('div','wrow',`<div><div class="w">${w[3]}</div><div class="m">${w[4]}</div></div>
    <div class="rt"><span class="chip gray">D${w[1]}</span>${mode==='wrong'?`<button class="icon-btn" data-clr="${w[0]}">✓</button>`:`<button class="icon-btn" data-unfav="${w[0]}">⭐</button>`}</div>`);wl.appendChild(r);});
  box.appendChild(wl);
  box.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>{S.wrong[+b.dataset.clr]=0;save();toast('오답 정복!');draw('wrong');seg.querySelector('[data-r=wrong]').textContent=`오답 (${wrongList().length})`;renderSidebar();});
  box.querySelectorAll('[data-unfav]').forEach(b=>b.onclick=()=>{S.fav[+b.dataset.unfav]=false;save();draw('fav');seg.querySelector('[data-r=fav]').textContent=`즐겨찾기 (${favList().length})`;});};
 seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.r);});
 draw('wrong');
}
function SESS_wrong(list){touchStreak();const N=S.config.quizCount>0?Math.min(S.config.quizCount,list.length):list.length;const chosen=shuffle(list).slice(0,N);
 const enCnt=Math.round(N*S.config.enPct/100);const dirs=shuffle([...Array(enCnt).fill('en'),...Array(N-enCnt).fill('ko')]);
 SESS={mode:S.config.quizMode,day:0,qs:chosen.map((w,i)=>({w,dir:dirs[i]||'en'})),i:0,correct:0,combo:0,maxCombo:0,wrongThis:[],gained:0,startMs:Date.now()};
 $('#pgTitle').textContent='오답 시험';SESS.mode==='sa'?renderSA():renderMC();
}

/* ===== A4 시험지 ===== */
function a4Page(day){const ws=wordsOf(day);const half=Math.ceil(ws.length/2);
 const enPart=ws.slice(0,half);  // 앞: 영→한
 const koPart=ws.slice(half);    // 뒤: 한→영
 const isWrong=id=>S.wrong[id]>0;
 const rowsEn=enPart.map((w,i)=>`<tr class="${isWrong(w[0])?'wrong-row':''}"><td class="no">${i+1}</td><td class="q">${w[3]}</td><td class="ans"></td></tr>`).join('');
 const rowsKo=koPart.map((w,i)=>`<tr class="${isWrong(w[0])?'wrong-row':''}"><td class="no">${half+i+1}</td><td class="q">${w[4]}</td><td class="ans"></td></tr>`).join('');
 const answers=ws.map((w,i)=>`<b>${i+1}.</b>${i<half?w[4]:w[3]}`).join('  ');
 const wrongCount=ws.filter(w=>isWrong(w[0])).length;
 return `<div class="a4">
   <div class="a4-head"><div class="a4-title">📚 워드마스터 수능 2000 · DAY ${day} 단어시험</div>
     <div class="a4-meta"><span>수능 영단어 2000 (2023 개정)</span><span>${new Date().toLocaleDateString('ko-KR')}</span></div></div>
   <div class="a4-info"><span><b>이름</b> <span class="fill"></span></span><span><b>날짜</b> <span class="fill"></span></span><span><b>점수</b> <span class="fill"></span> / ${ws.length}</span>${wrongCount?`<span class="wrong-tag">★ 온라인 오답 ${wrongCount}개 표시됨</span>`:''}</div>
   <div class="a4-section-label">Ⅰ. 다음 단어의 뜻을 쓰시오 (영→한)</div>
   <table class="a4-table"><thead><tr><th>번호</th><th>단어</th><th>뜻</th></tr></thead><tbody>${rowsEn}</tbody></table>

<script>
/* ============================================================
   18DAY 적응형 학습 통합 레이어
   - 원본 단어/애니메이션 보존
   - 관리자 시간표, 15분 블록, 원형 잔여량, 선택형 우선
   - 철자 회상/오답 각인만 타이핑
   - 숙달 항목 반복 단축, DAY 완료 자동 메일
   ============================================================ */
var WM_SCHEMA=10;
var activeFocusDay=null,focusTimerInterval=null,TYPING=null;

function covered(id){return !!((S.seen&&S.seen[id])||(S.legacyCredit&&S.legacyCredit[id]));}
function coveredCount(){return WORDS.reduce((n,w)=>n+(covered(w[0])?1:0),0);}
function dayProgress(d){const ws=wordsOf(d);return{seen:ws.filter(w=>covered(w[0])).length,total:ws.length,actualSeen:ws.filter(w=>S.seen&&S.seen[w[0]]).length};}
function firstUnfinishedDay(){for(let d=1;d<=DAYS;d++)if(!isDayDone(d))return d;return DAYS;}
function currentDay(){return firstUnfinishedDay();}
function allDaysDone(){return completedDayCount()>=DAYS;}

function ensureAdaptiveState(){
 S.schedule=S.schedule&&typeof S.schedule==='object'?S.schedule:{};
 S.focus=S.focus&&typeof S.focus==='object'?S.focus:{};
 S.mailStatus=S.mailStatus&&typeof S.mailStatus==='object'?S.mailStatus:{};
 S.pendingDayMails=Array.isArray(S.pendingDayMails)?S.pendingDayMails:[];
 S.legacyCredit=S.legacyCredit&&typeof S.legacyCredit==='object'?S.legacyCredit:{};
 S.config=S.config||{};
 if(S.config.blockMinutes===undefined)S.config.blockMinutes=15;
 if(S.config.fallbackMinutes===undefined)S.config.fallbackMinutes=90;
 if(S.config.spellingCount===undefined)S.config.spellingCount=10;
 if(S.config.adaptiveMasteredRate===undefined)S.config.adaptiveMasteredRate=25;
}

function upgradeTo18Days(){
 ensureAdaptiveState();S.meta=S.meta||{};
 if((S.meta.schemaVersion||0)<8){
  const oldDone={...(S.dayDone||{})},oldRecords={...(S.dayRecords||{})},oldLog={...(S.dayLog||{})};
  S.legacyDayDone30=oldDone;S.legacyDayRecords30=oldRecords;S.legacyDayLog30=oldLog;
  WORDS.forEach(w=>{const od=ORIGINAL_DAY_BY_ID[w[0]];if(oldDone[od])S.legacyCredit[w[0]]=true;});
  S.dayDone={};S.dayRecords={};S.dayLog={};
  for(let d=1;d<=DAYS;d++){
   const ws=wordsOf(d),n=ws.filter(w=>covered(w[0])).length;
   if(ws.length&&n===ws.length){
    S.dayDone[d]=true;S.dayRecords[d]={status:'completed',completionMethod:'migration_30_to_18',migrated:true,completedAt:new Date().toISOString(),legacyCovered:n};
   }else if(n>0){S.dayRecords[d]={status:'in_progress',completionMethod:'migration_30_to_18',migrated:true,legacyCovered:n};}
  }
  S.meta.relayout={fromDays:30,toDays:18,wordCount:TOTAL,rootCount:ROOT_TOTAL,at:new Date().toISOString()};
  S.meta.schemaVersion=8;
 }
 if((S.meta.schemaVersion||0)<9){S.meta.schemaVersion=9;}
 if((S.meta.schemaVersion||0)<10){S.meta.schemaVersion=10;}
 let last=0;for(let d=1;d<=DAYS;d++)if(isDayDone(d))last=d;
 S.progress=S.progress||{};S.progress.lastCompletedDay=last;S.progress.currentDay=currentDay();
 save();
}
upgradeTo18Days();
TITLES.Study[1]='18DAY 완성 · 15분 집중 블록';
TITLES.Quiz[1]='태블릿 선택형 우선 · 철자만 타이핑';
TITLES.Config[1]='시간표 · 분량 · 출제 관리';

function getSchedule(day){ensureAdaptiveState();return S.schedule[day]||{date:'',start:'',end:'',blockMinutes:S.config.blockMinutes||15};}
function timeToMinutes(v){if(!v||!/^[0-2]\d:[0-5]\d$/.test(v))return null;const [h,m]=v.split(':').map(Number);return h*60+m;}
function getDayPlan(day){
 const sch=getSchedule(day),bm=Math.max(10,Math.min(30,+sch.blockMinutes||+S.config.blockMinutes||15));
 const a=timeToMinutes(sch.start),b=timeToMinutes(sch.end);let planned=+S.config.fallbackMinutes||90;
 if(a!==null&&b!==null){planned=b-a;if(planned<=0)planned+=1440;}
 planned=Math.max(bm,planned);const blockCount=Math.max(1,Math.ceil(planned/bm));
 const words=wordsOf(day),counts=balancedCounts(words.length,blockCount),blocks=[];let p=0;
 counts.forEach((c,i)=>{blocks.push({index:i,words:words.slice(p,p+c),minutes:bm});p+=c;});
 return{day,sch,blockMinutes:bm,plannedMinutes:planned,blocks};
}
function scheduleLabel(day){const s=getSchedule(day);return s.start&&s.end?`${s.start} ~ ${s.end}`:'관리자 시간표 미설정';}
function focusState(day){ensureAdaptiveState();if(!S.focus[day])S.focus[day]={completedBlocks:{},rewardedBlocks:{},elapsedSeconds:0,activeSince:null,spellingDone:false,spellingRewarded:false};return S.focus[day];}
function elapsedFocusSeconds(day){const f=focusState(day);return Math.max(0,(+f.elapsedSeconds||0)+(f.activeSince?Math.floor((Date.now()-f.activeSince)/1000):0));}
function remainingFocusSeconds(day){return Math.max(0,getDayPlan(day).plannedMinutes*60-elapsedFocusSeconds(day));}
function formatClock(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function resumeFocusTimer(day){

}
function pauseFocusTimer(commit=true){
 if(activeFocusDay){const f=focusState(activeFocusDay);if(f.activeSince){f.elapsedSeconds=(+f.elapsedSeconds||0)+Math.max(0,Math.floor((Date.now()-f.activeSince)/1000));f.activeSince=null;if(commit)save();}}
 if(focusTimerInterval){clearInterval(focusTimerInterval);focusTimerInterval=null;}activeFocusDay=null;
}
function ringOffset(pct){return 326.73*(1-Math.max(0,Math.min(100,pct))/100);}
function updateFocusVisuals(day){
 const time=remainingFocusSeconds(day),plan=getDayPlan(day),timePct=plan.plannedMinutes?100-(time/(plan.plannedMinutes*60)*100):0,dp=dayProgress(day),amountPct=dp.total?dp.seen/dp.total*100:0;
 const t=$('#timeRing'),a=$('#amountRing');if(t)t.style.strokeDashoffset=ringOffset(timePct);if(a)a.style.strokeDashoffset=ringOffset(amountPct);
 const tt=$('#timeRemain'),aa=$('#amountRemain');if(tt)tt.textContent=formatClock(time);if(aa)aa.textContent=Math.max(0,dp.total-dp.seen)+'개';
}
function completedBlockCount(day){const f=focusState(day);return Object.values(f.completedBlocks||{}).filter(Boolean).length;}
function allBlocksDone(day){return completedBlockCount(day)>=getDayPlan(day).blocks.length;}
function nextBlockIndex(day){const p=getDayPlan(day),f=focusState(day);for(const b of p.blocks)if(!f.completedBlocks[b.index])return b.index;return p.blocks.length-1;}
function adaptivePool(raw){
 const weak=raw.filter(w=>(S.mastered[w[0]]||0)<2||(S.wrong[w[0]]||0)>0),strong=raw.filter(w=>!weak.includes(w));
 const rate=Math.max(0,Math.min(100,+S.config.adaptiveMasteredRate||25));const sample=shuffle(strong).slice(0,Math.ceil(strong.length*rate/100));

function renderTypingCard(){
 const x=TYPING,w=x.list[x.i],imprint=x.type==='imprint';stage('vQuiz',`<div class="typing-card"><div class="q-head"><button class="btn btn-ghost sm" onclick="${x.returnDay?`startFocusDay(${x.returnDay})`:`go('Review')`}">← 나가기</button><div class="q-prog">${x.i+1}/${x.list.length}</div></div><div class="progline"><i style="width:${x.i/x.list.length*100}%"></i></div><div class="card" style="margin-top:18px;text-align:center"><span class="chip ${imprint?'pink':'cyan'}">${imprint?'오답 각인':'철자 회상'}</span><div class="q-word" style="font-size:30px;margin:24px 0">${w[4]}</div><input class="sa-input" id="typingInput" placeholder="영어 철자를 입력하세요" autocomplete="off" autocapitalize="none" spellcheck="false"><div class="sa-feedback" id="typingFb"></div><div id="typingAns"></div><button class="btn btn-hero wfull tablet-action" style="margin-top:16px" id="typingSubmit">확인</button></div></div>`);
 const inp=$('#typingInput'),btn=$('#typingSubmit');inp.focus();btn.addEventListener('click',submitTyping);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitTyping();}});
}
function submitTyping(){
 const inp=$('#typingInput');if(!inp)return;const w=TYPING.list[TYPING.i],u=inp.value.trim().toLowerCase().replace(/\s+/g,''),ans=w[3].toLowerCase().replace(/\s+/g,'');if(!u){toast('철자를 입력하세요');return;}
 const fb=$('#typingFb'),box=$('#typingAns');if(u===ans){
  fb.style.color='var(--green)';fb.textContent=TYPING.retry?'✓ 정확히 다시 입력했습니다':'✓ 정확한 철자입니다';S.seen[w[0]]=true;S.mastered[w[0]]=(S.mastered[w[0]]||0)+1;
  if(TYPING.type==='imprint')S.wrong[w[0]]=0;TYPING.correct++;save();addXP(TYPING.retry?8:15,innerWidth/2,innerHeight*.5);setTimeout(nextTyping,420);
 }else{
  TYPING.retry=true;S.mastered[w[0]]=0;S.wrong[w[0]]=(S.wrong[w[0]]||0)+1;save();fb.style.color='var(--red)';fb.textContent='정답을 보고 정확히 다시 입력하세요';box.innerHTML=`<div class="typing-answer">${w[3]}</div>`;inp.value='';inp.focus();
 }
}
function nextTyping(){TYPING.retry=false;if(TYPING.i>=TYPING.list.length-1){finishTyping();return;}TYPING.i++;renderTypingCard();}
function finishTyping(){
 const {type,day,list,correct,returnDay}=TYPING;if(type==='spelling'&&day){const f=focusState(day);f.spellingDone=true;if(!f.spellingRewarded){f.spellingRewarded=true;save();addXP(80,innerWidth/2,innerHeight*.35);confetti(innerWidth/2,innerHeight*.35,120);}else save();if(allBlocksDone(day)){maybeFinalizeFocusDay(day);return;}}
 if(type==='imprint'){confetti(innerWidth/2,innerHeight*.35,90);}
 stage('vQuiz',`<div class="result reward-burst"><div class="em">${type==='spelling'?'✍️':'✅'}</div><div class="score">${type==='spelling'?'철자 회상 완료':'오답 각인 완료'}</div><div class="pct grad-lime">${correct}/${list.length}</div><button class="btn btn-hero wfull tablet-action" onclick="${returnDay?`startFocusDay(${returnDay})`:`go('Review')`}">${returnDay?'집중 학습으로':'오답노트로'}</button></div>`);
}
function maybeFinalizeFocusDay(day){
 const f=focusState(day);if(!allBlocksDone(day)){toast('남은 집중 블록이 있습니다');startFocusDay(day);return;}if(!f.spellingDone){startSpellingRecall(day);return;}if(!isDayDone(day))completeDay(day,{completionMethod:'focus_blocks',blockCount:getDayPlan(day).blocks.length,spellingDone:true});
 confetti(innerWidth/2,innerHeight*.35,180);stage('vQuiz',`<div class="result reward-burst"><div class="em">🏆</div><div class="score">DAY ${day} 완료</div><div class="pct grad-lime">+200 XP</div><div class="card" style="margin:16px 0;padding:15px"><b style="color:var(--green)">완료 기록 저장</b><div class="mini" style="margin-top:4px">관리자에게 DAY 완료 메일을 자동 발송합니다.</div></div><button class="btn btn-hero wfull tablet-action" onclick="go('Home')">다음 DAY 확인</button></div>`);
}
function completeDay(day,detail={}){
 const now=new Date().toISOString(),r=S.dayRecords[day]||{},wasDone=isDayDone(day);S.dayDone[day]=true;S.dayRecords[day]={...r,...detail,status:'completed',startedAt:r.startedAt||now,completedAt:r.completedAt||now,lastActivityAt:now};S.dayLog[day]=S.dayLog[day]||{firstDone:today(),quizzes:0,bestPct:0};S.dayLog[day].completedAt=now;S.dayLog[day].lastStudied=today();S.progress.lastCompletedDay=Math.max(S.progress.lastCompletedDay||0,day);S.progress.lastCompletedAt=now;S.progress.currentDay=currentDay();S.progress.lastActivityAt=now;save();
 if(!wasDone){addXP(200,innerWidth/2,innerHeight*.32);autoMailDayCompletion(day,detail);}
}

function autoMailDayCompletion(day,detail={}){
 ensureAdaptiveState();const rec=S.dayRecords[day]||{};if(rec.emailSentAt||S.mailStatus[day]==='sending'||detail.completionMethod==='admin_force')return;
 if(!emailJSReady||!window.emailjs){if(!S.pendingDayMails.includes(day))S.pendingDayMails.push(day);S.mailStatus[day]='queued';save();setTimeout(retryPendingDayMails,1800);return;}
 S.mailStatus[day]='sending';save();const dp=dayProgress(day),lg=S.dayLog[day]||{},L=levelInfo(),totQ=S.quizStat.done,accur=totQ?Math.round(S.quizStat.correct/totQ*100):0;
 emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{to_email:ADMIN_EMAIL,user_name:`학습자 · DAY ${day} 완료`,report_date:new Date().toLocaleString('ko-KR'),progress:Math.round(coveredCount()/TOTAL*100),mastered:masteredCount(),accuracy:accur,streak:S.streak,total_xp:S.xp,level:L.lv,level_name:L.name,history_count:1,recent_history:`DAY ${day} 완료 · ${dp.total}단어 · 집중블록 ${getDayPlan(day).blocks.length}개 · 최고점 ${lg.bestPct||0}%`})
 .then(()=>{S.mailStatus[day]='sent';S.dayRecords[day].emailSentAt=new Date().toISOString();S.pendingDayMails=S.pendingDayMails.filter(x=>x!==day);save();toast('✓ DAY 완료 메일 자동 발송');})
 .catch(e=>{console.error(e);S.mailStatus[day]='failed';if(!S.pendingDayMails.includes(day))S.pendingDayMails.push(day);save();toast('⚠ 완료 메일 대기열 저장');});
}
function retryPendingDayMails(){ensureAdaptiveState();if(!emailJSReady){initEmailJS();return;}const day=S.pendingDayMails.find(d=>isDayDone(d)&&!(S.dayRecords[d]||{}).emailSentAt);if(day){S.mailStatus[day]='queued';autoMailDayCompletion(day,{completionMethod:(S.dayRecords[day]||{}).completionMethod});}}
setTimeout(retryPendingDayMails,2200);

function renderReview(){
 const v=$('#vReview');v.innerHTML=`<div class="seg" id="rSeg"><button class="on" data-r="wrong">오답 (${wrongList().length})</button><button data-r="fav">즐겨찾기 (${favList().length})</button></div><div id="rBox"></div>`;const seg=$('#rSeg'),box=$('#rBox');
 const draw=mode=>{const list=mode==='wrong'?wrongList():favList();box.innerHTML='';if(!list.length){box.appendChild(el('div','empty',`<div class="i">${mode==='wrong'?'✅':'☆'}</div>${mode==='wrong'?'오답이 없어요!':'즐겨찾기가 없어요'}`));return;}
  if(mode==='wrong'){const b=el('button','btn btn-hero tablet-action','⌨ 오답 '+list.length+'개 철자 각인');b.style.marginBottom='16px';b.onclick=()=>startWrongImprint(list,0);box.appendChild(b);}
  const wl=el('div','wlist');list.forEach(w=>{const r=el('div','wrow',`<div><div class="w">${w[3]}</div><div class="m">${w[4]}</div></div><div class="rt"><span class="chip gray">D${w[1]}</span>${mode==='wrong'?`<span class="chip pink">${S.wrong[w[0]]||1}회</span>`:`<button class="icon-btn" data-unfav="${w[0]}">⭐</button>`}</div>`);wl.appendChild(r);});box.appendChild(wl);box.querySelectorAll('[data-unfav]').forEach(b=>b.onclick=()=>{S.fav[+b.dataset.unfav]=false;save();draw('fav');});};
 seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw(b.dataset.r);});draw('wrong');
}
function SESS_wrong(list){startWrongImprint(list,0);}

function renderConfig(){
 ensureAdaptiveState();const c=S.config,sd=+($('#scheduleDay')&&$('#scheduleDay').value)||currentDay(),sch=getSchedule(sd),maxDay=Math.max(...DAY_WORD_COUNTS);
 $('#vConfig').innerHTML=`
  <div class="source-audit"><div class="metric-card-lite"><div class="stat-lbl">단어 원본</div><div class="n grad-txt">${TOTAL}</div><div class="mini">원본 순서·뜻 보존</div></div><div class="metric-card-lite"><div class="stat-lbl">ROOT 원본</div><div class="n">${ROOT_TOTAL}</div><div class="mini">${ROOT_TOTAL?'자동 인식·균등 배치':'현재 HTML 소스에 데이터 없음'}</div></div><div class="metric-card-lite"><div class="stat-lbl">18DAY 분량</div><div class="n grad-lime">${Math.min(...DAY_WORD_COUNTS)}~${maxDay}</div><div class="mini">DAY 1~2: 112개 · 나머지: 111개</div></div></div>
  <div class="card" style="margin-bottom:18px"><div style="font-family:var(--disp);font-weight:700;font-size:19px">관리자 전용 시간표</div><div class="mini" style="margin:4px 0 18px">학습자에게는 시작·종료시간과 오늘 분량만 표시됩니다.</div>
   <div class="schedule-editor"><label>DAY<select class="select-box" id="scheduleDay" onchange="renderConfig()">${Array.from({length:DAYS},(_,i)=>`<option value="${i+1}" ${i+1===sd?'selected':''}>DAY ${i+1}</option>`).join('')}</select></label><label>시작시간<div class="time-wrap"><input type="time" id="scheduleStart" value="${sch.start||''}"></div></label><label>종료시간<div class="time-wrap"><input type="time" id="scheduleEnd" value="${sch.end||''}"></div></label><label>집중블록(분)<input class="num-input" style="width:100%;margin-top:5px" id="scheduleBlock" type="number" min="10" max="30" value="${sch.blockMinutes||15}"></label></div>
   <div class="admin-actions" style="margin-top:16px"><button class="btn btn-hero" onclick="saveScheduleForDay()">시간표 저장</button><button class="btn btn-ghost" onclick="copyScheduleToRemaining()">현재 설정을 이후 DAY에 적용</button></div>
  </div>
  <div class="grid g-2" style="align-items:start"><div class="card"><div style="font-family:var(--disp);font-weight:700;font-size:19px;margin-bottom:4px">태블릿 선택형 설정</div><div class="mini" style="margin-bottom:18px">일반 학습은 4지선다 고정, 타이핑은 철자 회상·오답 각인에만 사용</div><div class="cfg-row"><div><div class="cfg-label">블록당 최대 문항</div><div class="cfg-desc">전체는 해당 블록의 적응형 대상 전부</div></div><div class="seg" style="margin:0"><button class="${c.quizCount===0?'on':''}" onclick="setCount(0)">전체</button><button class="${c.quizCount>0?'on':''}" onclick="setCount(20)">직접지정</button></div></div>${c.quizCount>0?`<div class="cfg-row"><div><div class="cfg-label">문항 수</div><div class="cfg-desc">5 ~ ${maxDay}</div></div><input type="number" class="num-input" min="5" max="${maxDay}" value="${c.quizCount}" onchange="setCount(this.value)"></div>`:''}<div class="cfg-row"><div><div class="cfg-label">철자 회상 수</div><div class="cfg-desc">DAY 마무리에서 정확히 타이핑</div></div><input type="number" class="num-input" min="5" max="30" value="${c.spellingCount}" onchange="setSpellingCount(this.value)"></div><div class="cfg-row"><div><div class="cfg-label">숙달 반복 비율</div><div class="cfg-desc">숙달 2회 이상 항목 중 재출제 비율</div></div><input type="number" class="num-input" min="0" max="100" value="${c.adaptiveMasteredRate}" onchange="setMasteredRate(this.value)"></div></div>
   <div class="card"><div style="font-family:var(--disp);font-weight:700;font-size:19px;margin-bottom:4px">선택 문항 방향</div><div class="mini" style="margin-bottom:18px">영→한 / 한→영 비율</div><div class="ratio-wrap"><div class="ratio-bar"><div class="en" style="width:${c.enPct}%">영→한 ${c.enPct}%</div><div class="ko" style="width:${100-c.enPct}%">한→영 ${100-c.enPct}%</div></div></div><input type="range" class="slider" min="0" max="100" step="10" value="${c.enPct}" oninput="setRatio(this.value)"><div class="mail-note" style="margin-top:20px;margin-bottom:0"><b>DAY 완료 메일</b><br>집중 블록과 철자 회상을 모두 마치면 ${ADMIN_EMAIL}으로 자동 발송됩니다. 실패 시 브라우저에 대기열로 보존됩니다.</div></div></div>
  <div class="card" style="margin-top:18px"><div style="font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px">A4 시험지 출력</div><div class="mini" style="margin-bottom:16px">18DAY 재배치 기준으로 출력</div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><select class="select-box" id="printDay" style="max-width:200px">${Array.from({length:DAYS},(_,k)=>`<option value="${k+1}">DAY ${k+1}</option>`).join('')}</select><button class="btn btn-hero" onclick="buildA4(+document.getElementById('printDay').value)">📄 시험지 미리보기</button><button class="btn btn-ghost" onclick="buildA4All()">📚 전체 출력</button></div></div>`;
}
function saveScheduleForDay(){const d=+$('#scheduleDay').value,start=$('#scheduleStart').value,end=$('#scheduleEnd').value,bm=Math.max(10,Math.min(30,+$('#scheduleBlock').value||15));if((start&&!end)||(!start&&end)){toast('시작·종료시간을 함께 입력하세요');return;}S.schedule[d]={...(S.schedule[d]||{}),start,end,blockMinutes:bm};S.config.blockMinutes=bm;save();toast(`✓ DAY ${d} 시간표 저장`);renderConfig();}
function copyScheduleToRemaining(){const d=+$('#scheduleDay').value,start=$('#scheduleStart').value,end=$('#scheduleEnd').value,bm=Math.max(10,Math.min(30,+$('#scheduleBlock').value||15));if((start&&!end)||(!start&&end)){toast('시작·종료시간을 함께 입력하세요');return;}for(let i=d;i<=DAYS;i++)S.schedule[i]={...(S.schedule[i]||{}),start,end,blockMinutes:bm};S.config.blockMinutes=bm;save();toast(`✓ DAY ${d}~${DAYS} 시간표 적용`);renderConfig();}
function setCount(v){v=+v;S.config.quizCount=v===0?0:Math.max(5,Math.min(Math.max(...DAY_WORD_COUNTS),v||20));save();renderConfig();}
function setSpellingCount(v){S.config.spellingCount=Math.max(5,Math.min(30,+v||10));save();renderConfig();}
function setMasteredRate(v){S.config.adaptiveMasteredRate=Math.max(0,Math.min(100,+v||0));save();renderConfig();}

function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.seen)throw 0;S=o;normalizeState();upgradeTo18Days();save();toast('복원 완료');go('Admin');renderSidebar();}catch(err){toast('올바른 백업이 아닙니다');}};r.readAsText(f);}
window.addEventListener('beforeunload',()=>pauseFocusTimer());
</script>

<script id="wm-v11-script">
/* ============================================================
   v11 정밀 수정
   - DAY별 블록 및 예상시간 제거
   - 실제 활성 학습시간만 누적
   - 단어/문항/정답/오답 누적관리
   - 객관식 숫자키·터치 즉시 반응
   - 오답: 객관식 1회 재확인 → 나타내기 → 양방향 주관식
   ============================================================ */
WM_SCHEMA=11;
var activeStudyDay=null,dayTimerInterval=null,visibilityPausedDay=null;
var REMEDY=null,PENDING_WRONG_FLOW=null,remedyKeyHandler=null;

TITLES.Study[1]='18DAY 누적 학습 · 실제 소요시간 기록';
TITLES.Quiz[1]='숫자키·터치 선택 · 오답 양방향 교정';
TITLES.Config[1]='시간표 · 분량 · 출제 관리';
TITLES.Logs[1]='실제 학습 · 시험 시간';

function ensureV11State(){
 ensureAdaptiveState();let changed=false;
 if(!S.dayTime||typeof S.dayTime!=='object'){S.dayTime={};changed=true;}
 if(!S.dayMetrics||typeof S.dayMetrics!=='object'){S.dayMetrics={};changed=true;}
 if(!S.dayFlow||typeof S.dayFlow!=='object'){S.dayFlow={};changed=true;}
 S.meta=S.meta||{};
 for(let d=1;d<=DAYS;d++){
  if(!S.dayTime[d]){S.dayTime[d]={activeSeconds:0,activeSince:null,sessions:0,lastStartedAt:'',lastPausedAt:''};changed=true;}

}
function reportSummary(){const pct=Math.round(coveredCount()/TOTAL*100),totQ=S.quizStat.done,accur=totQ?Math.round(S.quizStat.correct/totQ*100):0,L=levelInfo();return `[워드마스터 수능2000 누적 학습 리포트]\n생성일: ${new Date().toLocaleString('ko-KR')}\n─────────────────────────\n■ 전체 진도: ${pct}% (${coveredCount()}/${TOTAL})\n■ 완료 DAY: ${completedDayCount()}/${DAYS}\n■ 실제 누적시간: ${fmtActual(totalActualSeconds())}\n■ 누적 문항: ${totQ}\n■ 정답률: ${accur}%\n■ 현재 오답: ${wrongList().length}\n■ 완전 암기: ${masteredCount()}\n■ 현재 DAY: ${currentDay()}\n■ 레벨: Lv.${L.lv} ${L.name}`;}
function downloadCSV(){let rows=[['DAY','누적단어','전체단어','학습률(%)','누적문항','정답','오답','객관식','오답재확인','주관식','나타내기','실제시간(초)','현재오답','상태','완료방식','완료일']];for(let d=1;d<=DAYS;d++){const dp=dayProgress(d),m=dayMetricState(d),rec=S.dayRecords[d]||{},wn=dayWrongWords(d).length,forced=rec.completionMethod==='admin_force'||rec.forced;rows.push([d,dp.seen,dp.total,Math.round(dp.seen/dp.total*100),m.answered,m.correct,m.wrong,m.mcAnswered,m.retryMcAnswered,m.subjectiveAnswered,m.revealCount,actualSeconds(d),wn,isDayDone(d)?'완료':dp.seen?'진행':'미시작',isDayDone(d)?(forced?'관리자 강제 수료':'학습 완료'):'',rec.completedAt?fmtFull(rec.completedAt):'']);}dl(`워드마스터_DAY별_누적_${today()}.csv`,'\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8');}
function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.seen)throw 0;commitDayTiming();S=o;normalizeState();upgradeTo18Days();ensureV11State();save();toast('복원 완료');go('Admin');renderSidebar();}catch(err){console.error(err);toast('올바른 백업이 아닙니다');}};r.readAsText(f);}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&activeStudyDay){visibilityPausedDay=activeStudyDay;commitDayTiming();}else if(!document.hidden&&visibilityPausedDay&&(cur==='Study'||cur==='Quiz')){const d=visibilityPausedDay;visibilityPausedDay=null;if(!isDayDone(d))beginDayTiming(d);}});
</script>

<script id="wm-v12-cloud-script">

   5) 관리자 자가점검 및 수동 동기화 제공

var WM_SCHEMA=12;

const WM_FIREBASE_CONFIG={
 apiKey:"AIzaSyCX4ceBT_jMtLymTFQPuDl8IX95Og4bpbc",
 authDomain:"root-voca.firebaseapp.com",
 projectId:"root-voca",

const WM_EMAIL_CONFIG={
 publicKey:"JJdWMghPhZrilD_ZQ",
 serviceId:"service_vz3hns6",
 templateId:"template_kgxlher",
 adminEmails:["sk01197375068@gmail.com"]
};
const WM_CLOUD_DOC={collection:"users",id:"user",field:"wm2000",syncField:"wm2000Sync"};

function wmClone(v){try{return structuredClone(v);}catch(e){return JSON.parse(JSON.stringify(v));}}
function wmIsoMs(v){const n=Date.parse(v||'');return Number.isFinite(n)?n:0;}
function wmMaxIso(a,b){return wmIsoMs(a)>=wmIsoMs(b)?(a||b):(b||a);}
function wmStableSig(v){try{return JSON.stringify(v,Object.keys(v||{}).sort());}catch(e){return String(v);}}
function wmUnionArray(a,b,limit=400){const out=[],seen=new Set();[...(a||[]),...(b||[])].forEach(x=>{const sig=wmStableSig(x);if(!seen.has(sig)){seen.add(sig);out.push(x);}});out.sort((x,y)=>wmIsoMs(y.date||y.at||y.login||y.completedAt)-wmIsoMs(x.date||x.at||x.login||x.completedAt));return out.slice(0,limit);}
function wmDeepEqual(a,b){try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return a===b;}}
function wmDeviceId(){
 try{let id=localStorage.getItem('wm2000-device-id');if(!id){id='dev-'+Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);localStorage.setItem('wm2000-device-id',id);}return id;}
 catch(e){return 'dev-memory-'+Math.random().toString(36).slice(2,8);}
}
function wmWithTimeout(promise,ms,label){
 return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label||'연결 시간 초과')),ms))]);
}

const CloudSync={
 ready:false,enabled:false,active:false,db:null,fs:null,unsub:null,
 status:'idle',message:'클라우드 준비',lastSyncAt:'',lastError:'',
 deviceId:wmDeviceId(),saveTimer:null,applyingRemote:false,uploading:false,
 lastSnapshot:null,lastUploadedRevision:0,initialLoaded:false,
 setStatus(status,message){this.status=status;this.message=message||'';updateCloudBadge();},
 async init(){
  if(this.ready&&this.enabled)return true;
  if(this.ready&&!this.enabled)this.ready=false;
  this.setStatus('syncing','Firebase 연결 중');
  try{
   const V='12.16.0';
   const modules=await wmWithTimeout(Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
   ]),7000,'Firebase SDK 연결 시간 초과');
   const {initializeApp,getApps,getApp}=modules[0];
   const fs=modules[1];
   const app=getApps().length?getApp():initializeApp(WM_FIREBASE_CONFIG);
   this.db=fs.getFirestore(app);this.fs=fs;this.ready=true;this.enabled=true;
   this.setStatus(navigator.onLine?'online':'offline',navigator.onLine?'클라우드 연결됨':'오프라인 · 로컬 저장');
   return true;
  }catch(e){
   this.ready=true;this.enabled=false;this.lastError=String(e&&e.message||e);
   this.setStatus('error','클라우드 연결 실패 · 로컬 저장');console.warn('[wm cloud] init failed',e);return false;
  }
 },
 ref(){return this.fs.doc(this.db,WM_CLOUD_DOC.collection,WM_CLOUD_DOC.id);},
 async read(){
  if(!this.enabled)return null;
  try{const snap=await this.fs.getDoc(this.ref());if(!snap.exists())return null;const d=snap.data()||{};return d[WM_CLOUD_DOC.field]||null;}
  catch(e){this.lastError=String(e&&e.message||e);this.setStatus(navigator.onLine?'error':'offline',navigator.onLine?'불러오기 실패 · 로컬 유지':'오프라인 · 로컬 저장');console.warn('[wm cloud] read failed',e);return null;}
 },
 cloudPayload(){
  const copy=wmClone(S);ensureV12State(copy);
  if(copy.dayTime){for(let d=1;d<=DAYS;d++){const t=copy.dayTime[d]||{};if(S.dayTime&&S.dayTime[d])t.activeSeconds=actualSeconds(d);t.activeSince=null;copy.dayTime[d]=t;}}
  copy.meta=copy.meta||{};copy.meta.schemaVersion=Math.max(12,+copy.meta.schemaVersion||0);
  copy.syncMeta=copy.syncMeta||{};copy.syncMeta.deviceId=this.deviceId;copy.syncMeta.updatedAt=new Date().toISOString();
  return copy;
 },
 async upload(reason='auto'){
  if(!this.active||!this.enabled||this.applyingRemote||this.uploading)return false;
  clearTimeout(this.saveTimer);this.saveTimer=null;this.uploading=true;this.setStatus('syncing','클라우드 저장 중');
  try{
   const payload=this.cloudPayload();const rev=+(payload.syncMeta&&payload.syncMeta.revision)||0;
   await this.fs.setDoc(this.ref(),{
    [WM_CLOUD_DOC.field]:payload,
    [WM_CLOUD_DOC.syncField]:{updatedAt:Date.now(),updatedIso:new Date().toISOString(),deviceId:this.deviceId,revision:rev,schema:12,reason,app:'WORD_MASTER_18DAY'}
   },{merge:true});
   this.lastUploadedRevision=Math.max(this.lastUploadedRevision,rev);this.lastSyncAt=new Date().toISOString();this.lastError='';
   this.setStatus('online','동기화 완료');return true;
  }catch(e){
   this.lastError=String(e&&e.message||e);this.setStatus(navigator.onLine?'error':'offline',navigator.onLine?'저장 실패 · 재시도 대기':'오프라인 · 재연결 시 동기화');console.warn('[wm cloud] upload failed',e);return false;
  }finally{this.uploading=false;renderCloudPanels();}
 },
 queue(reason='change'){
  if(!this.active)return;clearTimeout(this.saveTimer);this.saveTimer=setTimeout(()=>this.upload(reason),700);
 },
 async initialSync(){
  const ok=await this.init();this.active=true;if(!ok){this.initialLoaded=true;return false;}
  this.setStatus('syncing','기존 진도 확인 중');
  const remote=await this.read();
  if(remote){applyMergedRemote(remote,'initial');}
  else{await this.upload('first_local_migration');}
  this.initialLoaded=true;this.startRealtime();
  if(remote)await this.upload('initial_merged');
  return true;
 },
 startRealtime(){
  if(!this.enabled||this.unsub)return;
  this.unsub=this.fs.onSnapshot(this.ref(),snap=>{
   if(!snap.exists())return;const data=snap.data()||{},remote=data[WM_CLOUD_DOC.field],info=data[WM_CLOUD_DOC.syncField]||{};
   if(!remote)return;if(info.deviceId===this.deviceId&&(+info.revision||0)<=this.lastUploadedRevision)return;
   applyMergedRemote(remote,'realtime');this.lastSyncAt=new Date().toISOString();this.setStatus('online','다른 기기 진도 반영');renderCloudPanels();
  },e=>{this.lastError=String(e&&e.message||e);this.setStatus(navigator.onLine?'error':'offline','실시간 연결 중단 · 자동 재시도');console.warn('[wm cloud] snapshot failed',e);});
 },
 async reload(){
  if(!await this.init()){toast('클라우드 연결을 확인하세요');return false;}this.active=true;this.setStatus('syncing','클라우드 다시 불러오는 중');
  const remote=await this.read();if(!remote){toast('클라우드에 저장된 WORD MASTER 진도가 없습니다');this.setStatus('online','클라우드 자료 없음');return false;}
  applyMergedRemote(remote,'manual_reload');await this.upload('manual_reconciled');toast('✓ 클라우드 진도를 병합했습니다');return true;
 },
 async flush(){clearTimeout(this.saveTimer);this.saveTimer=null;return await this.upload('manual_flush');}
};

function ensureV12State(target=S){
 if(!target||typeof target!=='object')return target;
 ['seen','mastered','wrong','fav','dayDone','dayRecords','schedule','dayTime','dayMetrics','dayFlow','daily','dayLog','mailStatus','legacyCredit','wrongDetail'].forEach(k=>{if(!target[k]||typeof target[k]!=='object'||Array.isArray(target[k]))target[k]={};});
 ['history','sessions','adminActions','pendingDayMails'].forEach(k=>{if(!Array.isArray(target[k]))target[k]=[];});
 target.progress=target.progress&&typeof target.progress==='object'?target.progress:{currentDay:1,lastCompletedDay:0,lastCompletedAt:'',lastActivityAt:''};
 target.quizStat=target.quizStat&&typeof target.quizStat==='object'?target.quizStat:{done:0,correct:0};
 target.syncMeta=target.syncMeta&&typeof target.syncMeta==='object'?target.syncMeta:{};
 target.syncMeta.touched=target.syncMeta.touched&&typeof target.syncMeta.touched==='object'?target.syncMeta.touched:{};
 ['seen','mastered','wrong','fav','dayDone','dayRecords','schedule','dayTime','dayMetrics','dayFlow','daily','mailStatus','legacyCredit'].forEach(k=>{if(!target.syncMeta.touched[k]||typeof target.syncMeta.touched[k]!=='object')target.syncMeta.touched[k]={};});
 target.syncMeta.sections=target.syncMeta.sections&&typeof target.syncMeta.sections==='object'?target.syncMeta.sections:{};
 target.syncMeta.revision=Math.max(0,+target.syncMeta.revision||0);
 target.syncMeta.deviceId=target.syncMeta.deviceId||CloudSync.deviceId;
 for(let d=1;d<=DAYS;d++){
  if(!target.dayTime[d]||typeof target.dayTime[d]!=='object')target.dayTime[d]={activeSeconds:0,activeSince:null,sessions:0,lastStartedAt:'',lastPausedAt:''};
  if(!target.dayMetrics[d]||typeof target.dayMetrics[d]!=='object')target.dayMetrics[d]={answered:0,correct:0,wrong:0,mcAnswered:0,subjectiveAnswered:0,revealCount:0,retryMcAnswered:0,uniqueIds:{}};
  if(!target.dayMetrics[d].uniqueIds||typeof target.dayMetrics[d].uniqueIds!=='object')target.dayMetrics[d].uniqueIds={};
  if(!target.dayFlow[d]||typeof target.dayFlow[d]!=='object')target.dayFlow[d]={spellingDone:false,spellingAttempts:0,spellingCorrect:0,spellingIds:[]};
 }
 target.config=target.config||{};if(target.config.spellingCount===undefined)target.config.spellingCount=10;
 target.meta=target.meta||{};target.meta.schemaVersion=Math.max(12,+target.meta.schemaVersion||0);
 return target;
}
ensureV12State();

function markSyncChanges(prev,next){
 ensureV12State(next);const now=Date.now(),maps=['seen','mastered','wrong','fav','dayDone','dayRecords','schedule','dayTime','dayMetrics','dayFlow','daily','mailStatus'];
 maps.forEach(name=>{const a=(prev&&prev[name])||{},b=next[name]||{},keys=new Set([...Object.keys(a),...Object.keys(b)]);keys.forEach(k=>{if(!wmDeepEqual(a[k],b[k]))next.syncMeta.touched[name][k]=now;});});
 ['config','progress','quizStat','history','sessions','adminActions','wrongDetail','mailQueue','streakXp'].forEach(name=>{
  let av,bv;if(name==='streakXp'){av=prev?{streak:prev.streak,lastDate:prev.lastDate,xp:prev.xp}:{};bv={streak:next.streak,lastDate:next.lastDate,xp:next.xp};}
  else{av=prev&&prev[name];bv=next[name];}
  if(!wmDeepEqual(av,bv))next.syncMeta.sections[name]=now;
 });
 next.syncMeta.revision=(+next.syncMeta.revision||0)+1;next.syncMeta.updatedAt=new Date(now).toISOString();next.syncMeta.deviceId=CloudSync.deviceId;
}

function touchedAt(st,name,key){return +((((st||{}).syncMeta||{}).touched||{})[name]||{})[key]||0;}
function sectionAt(st,name){return +((((st||{}).syncMeta||{}).sections||{})[name]||0);}
function globalAt(st){return Math.max(wmIsoMs(st&&st.meta&&st.meta.lastSavedAt),wmIsoMs(st&&st.syncMeta&&st.syncMeta.updatedAt));}

<script id="wm-v13-recovery-script">

var WM_SCHEMA=13;
function wmHasMeaningfulProgress(st){
 st=st||{};
 const done=Object.values(st.dayDone||{}).some(Boolean);
 const seen=Object.values(st.seen||{}).some(Boolean);
 const metrics=Object.values(st.dayMetrics||{}).some(m=>(+((m||{}).answered)||0)>0||Object.keys((m||{}).uniqueIds||{}).length>0);

function wmRecoveryNeeded(){return !wmHasMeaningfulProgress(S)&&(!CloudSync.lastSyncAt||CloudSync.status==='needs_recovery'||CloudSync.status==='error');}
function wmRecoveryHtml(){
